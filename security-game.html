<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Охранник алкомаркета</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1efe8;--fg:#1b1b1b;--card:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eee;--card:#23272c}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#eee;--card:#23272c}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,sans-serif}
#app{max-width:860px;margin:0 auto;padding:10px;position:relative}
#hud{font-weight:600;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
#msg{min-height:20px;margin:6px 0;opacity:.8}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cam{background:var(--card);border-radius:10px;padding:4px}
canvas{width:100%;display:block;background:#000;border-radius:7px}
button{font:inherit;cursor:pointer}
.cam button{width:100%;margin-top:4px;padding:10px;border:0;border-radius:7px;background:#c0392b;color:#fff;font-weight:700}
.cam button:active{background:#8e2a20}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.78);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:10px;z-index:2}
#ov button{margin-top:14px;padding:12px 28px;border:0;border-radius:8px;background:#27ae60;color:#fff;font-weight:700;font-size:16px}
#ov{overflow:auto;justify-content:flex-start}.of{margin:auto;width:100%;max-width:480px}
.up{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:8px;padding:8px 10px;margin:6px 0;text-align:left}
#ov .up button{margin:0;padding:6px 12px;font-size:14px;background:#d68910}#ov .up button:disabled{opacity:.4}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.row button{flex:1}
</style></head><body>
<div id="app">
<div id="hud"></div><div id="msg"></div>
<div id="grid"></div>
<div id="ov"></div>
</div>
<script>
const W=400,H=240,names=['Вход','Водка','Вино и коньяк','Касса / выход'];
const $=s=>document.querySelector(s),grid=$('#grid');
names.forEach((n,i)=>grid.insertAdjacentHTML('beforeend',`<div class="cam"><canvas width="${W}" height="${H}"></canvas><button data-i="${i}">ОГОНЬ [${i+1}]</button></div>`));
const cx=[...grid.querySelectorAll('canvas')].map(c=>c.getContext('2d'));
grid.addEventListener('click',e=>{const b=e.target.closest('button');if(b)fire(+b.dataset.i)});
addEventListener('keydown',e=>{if(/^[1-4]$/.test(e.key))fire(+e.key-1)});
let P=[],score=0,stolen=0,bad=0,reload=0,t=0,sT=0,run=false,last=0,best=0,night=0,left=0,earned=0,money=0,pl=0,up={rl:0,nv:0,pt:0,ins:0,rad:0,g1:0,g2:0,g3:0},gt=[0,0,0],fl=[0,0,0,0],flc=['#fff','#fff','#fff','#fff'];
try{best=+localStorage.getItem('best')||0;const sv0=JSON.parse(localStorage.getItem('save')||'{}');money=sv0.money||0;Object.assign(up,sv0.up||{})}catch(e){}
const sv=()=>{try{localStorage.setItem('save',JSON.stringify({money,up}))}catch(e){}};
const rlT=()=>1-.15*up.rl,maxS=()=>5+up.ins,maxB=()=>3+up.pt;
const cols=['#c0392b','#2980b9','#27ae60','#8e44ad','#d68910','#16a085'];
const say=s=>$('#msg').textContent=s;
const hud=()=>$('#hud').innerHTML=`<span>${night?'🌙':'☀'} ${Math.max(0,Math.ceil(left))}с</span><span>💰 ${money+earned}₽</span><span>🍾 ${stolen}/${maxS()}</span><span>⚠ ${bad}/${maxB()}</span>`;
function start(n){night=n;left=n?90:70;earned=0;P=[];score=stolen=bad=0;reload=t=sT=0;gt=[0,0,0];run=true;last=performance.now();$('#ov').style.display='none';say(n?'Ночная смена. Темно и опасно!':'Дневная смена началась.');hud()}
function over(){run=false;const win=left<=0,bonus=win?(night?400:200):0;money+=earned+bonus;up.g3=0;if(score>best){best=score;try{localStorage.setItem('best',best)}catch(e){}}sv();
office(win?'Смена закончена ✅':stolen>=maxS()?'Магазин обокрали ❌':'Тебя оштрафовали за жалобы ❌',`Счёт ${score} · Заработано ${earned}₽`+(win?` + премия ${bonus}₽`:''))}
const GD=[['Стажёр','раз в 7 с',1000,7],['Профи','раз в 3.5 с',9000,3.5],['Спецназ','раз в 1.2 с — но только на одну смену',1,1.2]];
const UP={rl:['Быстрая перезарядка','Перезарядка на 0.15 с быстрее',150,4],nv:['Ночное видение','Ночью картинка светлее',200,3],pt:['Выдержка','+1 допустимая жалоба',250,2],ins:['Страховка','+1 допустимая кража',250,3],rad:['Датчики на бутылках','Вор с чекушкой помечен «!»',300,1]};
function office(h,d){const o=$('#ov');o.style.display='flex';
o.innerHTML=`<div class="of"><h2>${h||'🍾 Охранник алкомаркета'}</h2><p>${d||'Вор в чёрном берёт чекушку и бежит к выходу. «ОГОНЬ» бьёт по вору с бутылкой, а без вора попадёшь в покупателя. Клавиши 1–4.'}</p><h3>🏢 Офис · 💰 ${money}₽</h3>`+Object.keys(UP).map(k=>{const [n,ds,b,m]=UP[k],l=up[k],full=l>=m,c=b*(l+1);return `<div class="up"><span><b>${n}</b> ${l}/${m}<br><small>${ds}</small></span><button data-k="${k}" ${full||money<c?'disabled':''}>${full?'MAX':c+'₽'}</button></div>`}).join('')+`<h3>👮 Нанять охранника</h3>`+GD.map((g,k)=>{const h=up['g'+(k+1)];return `<div class="up"><span><b>${g[0]}</b><br><small>Сам стреляет по ворам с чекушкой ${g[1]}</small></span><button data-g="${k}" ${h||money<g[2]?'disabled':''}>${h?'Нанят':g[2]+'₽'}</button></div>`}).join('')+`<div class="row"><button data-s="0">☀ Дневная смена</button><button data-s="1">🌙 Ночная смена (×2 оплата)</button></div></div>`}
$('#ov').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.k){const k=b.dataset.k,c=UP[k][2]*(up[k]+1);if(money>=c&&up[k]<UP[k][3]){money-=c;up[k]++;sv();office($('#ov h2').innerHTML,$('#ov p').innerHTML)}}
else if(b.dataset.g!==undefined){const k=+b.dataset.g,c=GD[k][2];if(!up['g'+(k+1)]&&money>=c){money-=c;up['g'+(k+1)]=1;sv();office($('#ov h2').innerHTML,$('#ov p').innerHTML)}}
else if(b.dataset.s)start(+b.dataset.s)});
function spawn(){const th=Math.random()<(night?.6:.5),sc=1+(Math.random()*2|0);
const p={cam:0,x:0,y:Math.random(),sp:(.14+Math.random()*.05)*(night?1.25:1),type:th?'t':'s',has:0,pause:0,down:0,st:0,ph:Math.random()*6,stopCam:sc,stopX:.3+Math.random()*.4,col:th?'#1a1a1a':cols[Math.random()*6|0]};
p.endCam=th?3:sc+(Math.random()*(4-sc)|0);P.push(p)}
function fire(i){if(!run||reload>0)return;reload=rlT();fl[i]=.15;flc[i]='#fff';
const c=P.filter(p=>p.cam==i&&!p.down);const th=c.find(p=>p.type=='t'&&p.has);
if(th){th.down=1.2;score+=100;earned+=night?160:80;hud();say('Вор обезврежен! +'+(night?160:80)+'₽')}
else if(c.length){const v=c[0];v.down=1.2;bad++;say('Это был покупатель! Жалоба.')}
else say('Мимо — в кадре никого.');hud();if(bad>=maxB())over()}
function upd(dt){t+=dt;left-=dt;if(left<=0){over();return}if(Math.floor(left)!=pl){pl=Math.floor(left);hud()}reload=Math.max(0,reload-dt);fl=fl.map(f=>Math.max(0,f-dt));
sT-=dt;if(sT<=0){spawn();sT=Math.max(1.1,(night?2.6:3.8)-t/35)}
GD.forEach((g,k)=>{if(!up['g'+(k+1)])return;gt[k]-=dt;if(gt[k]>0)return;const th=P.filter(p=>p.type=='t'&&p.has&&!p.down).sort((a,b)=>b.cam-a.cam||b.x-a.x)[0];if(th){gt[k]=g[3];th.down=1.2;score+=100;earned+=night?160:80;fl[th.cam]=.2;flc[th.cam]='#3498db';say('Охранник «'+g[0]+'» подстрелил вора!');hud()}else gt[k]=0});
for(const p of P){
if(p.down>0){p.down-=dt;if(p.down<=0)p.gone=1;continue}
if(p.pause>0){p.pause-=dt;continue}
if(p.cam==p.stopCam&&!p.st&&p.x>=p.stopX){p.st=1;p.pause=p.type=='t'?1.4:1;continue}
if(p.type=='t'&&p.st&&!p.has){p.has=1;p.sp*=1.9;say('Кто-то схватил чекушку!')}
p.x+=p.sp*dt;
if(p.x>1){if(p.cam==p.endCam){if(p.has){stolen++;fl[p.cam]=.5;flc[p.cam]='#ff2020';say('Вор ушёл с чекушкой!');hud();if(stolen>=maxS())over()}p.gone=1}else{p.cam++;p.x=0}}}
P=P.filter(p=>!p.gone)}
function shelves(c,i){const pal=['#2e7d32','#c0392b','#d4ac0d','#f5f5f5','#6d4c41','#1565c0'];
for(let r=0;r<3;r++){const y=44+r*32;c.fillStyle='#3b2f25';c.fillRect(0,y,W,4);
for(let k=0,x=8;x<W-8;k++,x+=13){c.fillStyle=pal[(k*7+r*3+i*2)%6];c.fillRect(x,y-20,7,20);c.fillRect(x+2,y-26,3,6)}}
c.fillStyle='#fff';c.font='bold 11px sans-serif';c.fillText(i==1?'ВОДКА':'ВИНО / КОНЬЯК',W/2-34,12)}
function person(c,p){const s=.75+p.y*.5,px=p.x*W,py=H*(.5+.38*p.y),m=(p.pause>0||p.down>0)?0:Math.sin(t*12+p.ph)*3;
c.save();c.translate(px,py);c.scale(s,s);
c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(0,20,16,4,0,0,7);c.fill();
if(p.down>0)c.rotate(Math.PI/2);
c.fillStyle='#222';c.fillRect(-8,0,6,20+m);c.fillRect(2,0,6,20-m);
c.fillStyle=p.col;c.fillRect(-10,-30,20,32);
c.fillStyle='#e0b48c';c.beginPath();c.arc(0,-40,9,0,7);c.fill();
if(p.type=='t'){c.fillStyle='#111';c.fillRect(-9,-51,18,8)}else{c.fillStyle='#5a3d2b';c.fillRect(-9,-51,18,5)}
if(p.down>0){c.fillStyle='#000';c.font='bold 10px sans-serif';c.fillText('xx',-6,-37)}
if(p.has){c.fillStyle='#2e7d32';c.fillRect(11,-22,5,16);c.fillRect(12,-27,3,6);c.strokeStyle='#ffd700';c.lineWidth=1.5;c.strokeRect(10,-28,7,23)}
c.restore()}
function draw(i){const c=cx[i];
c.fillStyle='#6b7a74';c.fillRect(0,0,W,H*.45);c.fillStyle='#454d4a';c.fillRect(0,H*.45,W,H*.55);
if(i==1||i==2)shelves(c,i);
if(i==0){c.fillStyle='#9fc4d6';c.fillRect(8,24,70,90);c.fillStyle='#fff';c.font='bold 11px sans-serif';c.fillText('ВХОД',30,18)}
if(i==3){c.fillStyle='#9fc4d6';c.fillRect(W-62,24,52,80);c.fillStyle='#fff';c.font='bold 11px sans-serif';c.fillText('ВЫХОД',W-58,18);
c.fillStyle='#5d4a37';c.fillRect(20,H*.42,120,36);c.fillStyle='#222';c.fillRect(40,H*.34,30,20);c.fillStyle='#fff';c.fillText('КАССА',60,H*.42+22)}
P.filter(p=>p.cam==i).sort((a,b)=>a.y-b.y).forEach(p=>person(c,p));
c.fillStyle='rgba(0,70,30,.2)';c.fillRect(0,0,W,H);
if(night){c.fillStyle=`rgba(0,0,10,${.6-.14*up.nv})`;c.fillRect(0,0,W,H)}
if(up.rad)P.filter(p=>p.cam==i&&p.has&&!p.down).forEach(p=>{c.fillStyle='#ff3030';c.font='bold 22px sans-serif';c.fillText('!',p.x*W-4,H*(.5+.38*p.y)-62*(.75+p.y*.5))});
c.fillStyle='rgba(0,0,0,.12)';for(let y=0;y<H;y+=3)c.fillRect(0,y,W,1);
if(fl[i]>0){c.globalAlpha=Math.min(.7,fl[i]*3);c.fillStyle=flc[i];c.fillRect(0,0,W,H);c.globalAlpha=1}
c.font='bold 12px monospace';c.fillStyle='#d8ffd8';c.fillText(`CAM ${i+1} · ${names[i]}`,8,H-8);
if(Math.floor(t*2)%2==0||!run){c.fillStyle='#ff3030';c.fillText('● REC',W-56,H-8)}
if(reload>0){c.fillStyle='#ffd700';c.fillRect(0,H-3,W*(1-reload/rlT()),3)}}
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(run)upd(dt);for(let i=0;i<4;i++)draw(i);requestAnimationFrame(loop)}
office();requestAnimationFrame(n=>{last=n;loop(n)});
</script></body></html>
