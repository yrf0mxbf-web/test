<!-- IDEAS6-SUBPAGE (12.10): страница подписки, настроенная владельцем (конструктор «Страница подписки»). Старый вид — ?view=classic -->
<style>
:root{
  --bg:#0e1012;--surface:#16181b;--surface2:#1b1e21;--surface3:#222528;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);
  --text:rgba(255,255,255,.86);--strong:#fff;--muted:rgba(255,255,255,.55);--faint:rgba(255,255,255,.36);
  --acc:#2388ff;--acc-h:#479aff;--acc-soft:rgba(35,136,255,.16);--acc-text:#65aaff;--on-acc:#fff;
  --ok:#34d18e;--ok-soft:rgba(52,209,142,.13);--warn:#f2b13e;--warn-soft:rgba(242,177,62,.13);--bad:#f26d6d;--bad-soft:rgba(242,109,109,.12);
  --r:16px;--r-sm:11px;--shadow:0 10px 40px rgba(0,0,0,.35);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f3f2ee;--surface:#fff;--surface2:#f6f5f1;--surface3:#efeee9;
  --line:rgba(17,17,17,.09);--line2:rgba(17,17,17,.18);
  --text:#26282b;--strong:#111;--muted:rgba(17,17,17,.58);--faint:rgba(17,17,17,.4);
  --acc:#1f7ae0;--acc-h:#1675df;--acc-soft:rgba(35,136,255,.1);--acc-text:#1468c8;--on-acc:#fff;
  --ok:#0f8f5a;--ok-soft:rgba(15,158,99,.1);--warn:#9a5d00;--warn-soft:rgba(173,104,0,.1);--bad:#c43232;--bad-soft:rgba(210,59,59,.09);
  --shadow:0 10px 40px rgba(0,0,0,.06);color-scheme:light;
}
:root[data-theme=hacker]{
  --bg:#040805;--surface:#0a140d;--surface2:#0d1a11;--surface3:#102116;
  --line:#14301e;--line2:#1d4a2c;--text:#d2f0dc;--strong:#eafff2;--muted:#7fa891;--faint:#4f7460;
  --acc:#35ff8b;--acc-h:#6cffab;--acc-soft:rgba(53,255,139,.1);--acc-text:#35ff8b;--on-acc:#03170a;
  --ok:#35ff8b;--ok-soft:rgba(53,255,139,.12);--warn:#ffc857;--warn-soft:rgba(255,200,87,.12);--bad:#ff6262;--bad-soft:rgba(255,98,98,.1);
  --r:4px;--r-sm:3px;--shadow:none;--sans:var(--mono);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--acc-text)}
button{font:inherit}
.wrap{width:min(720px,100%);margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
:root[data-theme=hacker] .logo{border-radius:2px}
.top h1{margin:0;font-size:19px;line-height:1.25;color:var(--strong);font-weight:750;overflow-wrap:anywhere}
.top .who{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:17px;color:var(--strong);font-weight:750}
.card .lead{margin:0 0 14px;color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:700}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.on{color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:750;color:var(--strong);margin-top:2px;overflow-wrap:anywhere}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:600}
.kpi .s{font-size:13px;color:var(--muted);margin-top:2px}
.bar{height:8px;border-radius:6px;background:var(--surface3);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
@media(max-width:480px){.kpis{grid-template-columns:1fr}}
.renew{margin-top:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:2px;margin:0 -2px 6px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:650;cursor:pointer}
:root[data-theme=hacker] .tab{border-radius:2px}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.tab:focus-visible,.btn:focus-visible,.app:focus-within{outline:2px solid var(--acc-text);outline-offset:2px}
.detected{font-size:12.5px;color:var(--faint);margin:0 0 12px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.num{width:34px;height:34px;border-radius:50%;background:var(--acc-soft);color:var(--acc-text);display:grid;place-items:center;font-weight:800;font-size:16px}
:root[data-theme=hacker] .num{border-radius:2px}
.step h3{margin:5px 0 8px;font-size:16px;color:var(--strong);font-weight:700}
.step p{margin:0 0 8px;color:var(--text);font-size:14.5px}
.step .hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.apps{display:grid;gap:8px}
.app{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 10px;border:1px solid var(--line);background:var(--surface2);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer}
.app.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.app input{accent-color:var(--acc);width:18px;height:18px;margin:0;flex:none}
.app .nm{flex:1;min-width:0}
.app .nm b{display:block;color:var(--strong);font-size:15px}
.app .nm>span{display:block;color:var(--muted);font-size:12.5px}
.rec{display:inline-block;font-size:11px;font-weight:800;color:var(--acc-text);background:var(--acc-soft);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.get{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:520px){.app .get{grid-column:2/-1;justify-content:flex-start}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface2);color:var(--strong);font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;text-align:center}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;font-weight:650}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.primary:hover{background:var(--acc-h)}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media(max-width:400px){.row2{grid-template-columns:1fr}}
.srv{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.srv li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface2);min-width:0}
.srv .t{flex:1;min-width:0}
.srv .t b{display:block;color:var(--strong);font-weight:650;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srv .t span{display:block;color:var(--faint);font-size:12px}
details.adv{padding:0}
details.adv>summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:700;color:var(--strong);display:flex;align-items:center;gap:10px}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details.adv[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
details.adv>summary small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.advb{padding:0 18px 18px}
.kv{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px}
.kv td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.kv td.k{color:var(--muted);width:42%;padding-right:10px}
.kv td.v{color:var(--text);overflow-wrap:anywhere}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:16px 0 8px}
.lrow{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface2);margin:0 0 8px;min-width:0}
.lrow .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-size:13.5px}
.lrow .txt b,.lrow .txt small{display:block;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.lrow .txt small{font:600 11px/1.4 var(--mono);color:var(--faint);letter-spacing:.03em}
.tag{font:700 11px/1 var(--mono);letter-spacing:.04em;padding:5px 7px;border-radius:6px;text-transform:uppercase;flex:none;border:1px solid var(--line2);color:var(--muted)}
.tag.sub{color:var(--on-acc);background:var(--acc);border-color:var(--acc)}
.tag.proto{color:var(--acc-text)}
.ib{width:38px;height:38px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--acc-text);display:inline-grid;place-items:center;cursor:pointer;flex:none;padding:0}
.ib svg{width:17px;height:17px}
.foot{text-align:center;color:var(--faint);font-size:12.5px;margin-top:20px;display:grid;gap:6px}
.foot a{color:var(--muted)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:20px;max-width:340px;width:100%;text-align:center;position:relative}
.modal h3{margin:0 0 4px;color:var(--strong);font-size:16px;padding:0 30px}
.modal .s{color:var(--muted);font-size:12px;margin-bottom:14px;word-break:break-all;max-height:4.5em;overflow:hidden}
.modal canvas{width:240px;height:240px;max-width:100%;image-rendering:pixelated;background:#fff;border-radius:10px;padding:10px}
.modal .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:grid;gap:8px;justify-items:center;width:max-content;max-width:calc(100% - 32px)}
.tst{background:var(--surface3);border:1px solid var(--line2);color:var(--strong);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.qrbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qrbox canvas{width:150px;height:150px;image-rendering:pixelated;background:#fff;border-radius:10px;padding:8px;flex:none}
.qrbox p{flex:1;min-width:180px;margin:0;color:var(--muted);font-size:13.5px}
.nojs{padding:20px;text-align:center}
/* IDEAS6-SUBPAGE (12.10): своя страница владельца — логотип, объявление, приветствие, QR, поддержка, FAQ, инструкции */
.logo.img{background:none;padding:0;overflow:hidden}
.logo.img img{width:100%;height:100%;object-fit:contain;display:block}
.top .sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;margin:0 0 14px;font-size:14.5px;border:1px solid transparent;overflow-wrap:anywhere}
.notice::before{content:"i";flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--sans);margin-top:1px}
.notice.info{background:var(--acc-soft);border-color:var(--acc-soft);color:var(--text)}
.notice.info::before{background:var(--acc);color:var(--on-acc)}
.notice.warn{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--text)}
.notice.warn::before{content:"!";background:var(--warn);color:#111}
.notice .nb p,.rich p{margin:0 0 8px}.notice .nb p:last-child,.rich p:last-child{margin-bottom:0}
.notice .nb{min-width:0;flex:1}
.greet{font-size:15px}
.rich{overflow-wrap:anywhere}
.rich a{color:var(--acc-text)}
.step .sx{margin:0 0 10px;color:var(--text);font-size:14.5px}
.app .ic{width:22px;height:22px;border-radius:6px;object-fit:cover;vertical-align:-5px;margin-right:6px}
.guide{margin-top:12px;border:1px solid var(--line);background:var(--surface2);border-radius:var(--r-sm);padding:12px 14px}
.guide h4{margin:0 0 6px;font-size:14px;color:var(--strong)}
.guide .rich{font-size:14px}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.shots a{display:block;width:96px;height:170px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:var(--surface3)}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
.qrcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrcard canvas{width:180px;height:180px;image-rendering:pixelated;background:#fff;border-radius:12px;padding:8px;flex:none}
.qrcard .qt{flex:1;min-width:200px}
.qrcard .qt p{margin:0 0 10px;color:var(--muted);font-size:14px}
.sup{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sup .btn{flex:1 1 140px}
.faq details{border-top:1px solid var(--line)}
.faq details:first-of-type{border-top:0}
.faq summary{cursor:pointer;list-style:none;padding:12px 0;font-weight:700;color:var(--strong);display:flex;gap:10px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:700;font-size:18px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq .rich{padding:0 0 12px;color:var(--text);font-size:14.5px}
.foot .rich{color:var(--faint)}
.foot .rich a{color:var(--muted)}
</style>

     * Instances of this class represent an immutable square grid of dark and light cells.
     * The class provides static factory functions to create a QR Code from text or binary data.
     * The class covers the QR Code Model 2 specification, supporting all versions (sizes)
     * from 1 to 40, all 4 error correction levels, and 4 character encoding modes.
     *
     * Ways to create a QR Code object:
     * - High level: Take the payload data and call QrCode.encodeText() or QrCode.encodeBinary().
     * - Mid level: Custom-make the list of segments and call QrCode.encodeSegments().
     * - Low level: Custom-make the array of data codeword bytes (including
     *   segment headers and final padding, excluding error correction codewords),
     *   supply the appropriate version number, and call the QrCode() constructor.
     * (Note that all ways require supplying the desired error correction level.)
     */
    class QrCode {
        /*-- Constructor (low level) and fields --*/
        // Creates a new QR Code with the given version number,
        // error correction level, data codeword bytes, and mask number.
        // This is a low-level API that most users should not use directly.
        // A mid-level API is the encodeSegments() function.
        constructor(
        // The version number of this QR Code, which is between 1 and 40 (inclusive).
        // This determines the size of this barcode.
        version, 
        // The error correction level used in this QR Code.
        errorCorrectionLevel, dataCodewords, msk) {
            this.version = version;
            this.errorCorrectionLevel = errorCorrectionLevel;
            // The modules of this QR Code (false = light, true = dark).
            // Immutable after constructor finishes. Accessed through getModule().
            this.modules = [];
            // Indicates function modules that are not subjected to masking. Discarded when constructor finishes.
            this.isFunction = [];
            // Check scalar arguments
            if (version < QrCode.MIN_VERSION || version > QrCode.MAX_VERSION)
                throw new RangeError("Version value out of range");
            if (msk < -1 || msk > 7)
                throw new RangeError("Mask value out of range");
            this.size = version * 4 + 17;
            // Initialize both grids to be size*size arrays of Boolean false
            let row = [];
            for (let i = 0; i < this.size; i++)
                row.push(false);
            for (let i = 0; i < this.size; i++) {
                this.modules.push(row.slice()); // Initially all light
                this.isFunction.push(row.slice());
            }
            // Compute ECC, draw modules
            this.drawFunctionPatterns();
            const allCodewords = this.addEccAndInterleave(dataCodewords);
            this.drawCodewords(allCodewords);
            // Do masking
            if (msk == -1) { // Automatically choose best mask
                let minPenalty = 1000000000;
                for (let i = 0; i < 8; i++) {
                    this.applyMask(i);
                    this.drawFormatBits(i);
                    const penalty = this.getPenaltyScore();
                    if (penalty < minPenalty) {
                        msk = i;
                        minPenalty = penalty;
                    }
                    this.applyMask(i); // Undoes the mask due to XOR
                }
            }
            assert(0 <= msk && msk <= 7);
            this.mask = msk;
            this.applyMask(msk); // Apply the final choice of mask
            this.drawFormatBits(msk); // Overwrite old format bits
            this.isFunction = [];
        }
        /*-- Static factory functions (high level) --*/
        // Returns a QR Code representing the given Unicode text string at the given error correction level.
        // As a conservative upper bound, this function is guaranteed to succeed for strings that have 738 or fewer
        // Unicode code points (not UTF-16 code units) if the low error correction level is used. The smallest possible
        // QR Code version is automatically chosen for the output. The ECC level of the result may be higher than the
        // ecl argument if it can be done without increasing the version.
        static encodeText(text, ecl) {
            const segs = qrcodegen.QrSegment.makeSegments(text);
            return QrCode.encodeSegments(segs, ecl);
        }
        // Returns a QR Code representing the given binary data at the given error correction level.
        // This function always encodes using the binary segment mode, not any text mode. The maximum number of
        // bytes allowed is 2953. The smallest possible QR Code version is automatically chosen for the output.
        // The ECC level of the result may be higher than the ecl argument if it can be done without increasing the version.
        static encodeBinary(data, ecl) {
            const seg = qrcodegen.QrSegment.makeBytes(data);
            return QrCode.encodeSegments([seg], ecl);
        }
        /*-- Static factory functions (mid level) --*/
        // Returns a QR Code representing the given segments with the given encoding parameters.
        // The smallest possible QR Code version within the given range is automatically
        // chosen for the output. Iff boostEcl is true, then the ECC level of the result
        // may be higher than the ecl argument if it can be done without increasing the
        // version. The mask number is either between 0 to 7 (inclusive) to force that
        // mask, or -1 to automatically choose an appropriate mask (which may be slow).
        // This function allows the user to create a custom sequence of segments that switches
        // between modes (such as alphanumeric and byte) to encode text in less space.
        // This is a mid-level API; the high-level API is encodeText() and encodeBinary().
        static encodeSegments(segs, ecl, minVersion = 1, maxVersion = 40, mask = -1, boostEcl = true) {
            if (!(QrCode.MIN_VERSION <= minVersion && minVersion <= maxVersion && maxVersion <= QrCode.MAX_VERSION)
                || mask < -1 || mask > 7)
                throw new RangeError("Invalid value");
            // Find the minimal version number to use
            let version;
            let dataUsedBits;
            for (version = minVersion;; version++) {
                const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8; // Number of data bits available
                const usedBits = QrSegment.getTotalBits(segs, version);
                if (usedBits <= dataCapacityBits) {
                    dataUsedBits = usedBits;
                    break; // This version number is found to be suitable
                }
                if (version >= maxVersion) // All versions in the range could not fit the given data
                    throw new RangeError("Data too long");
            }
            // Increase the error correction level while the data still fits in the current version number
            for (const newEcl of [QrCode.Ecc.MEDIUM, QrCode.Ecc.QUARTILE, QrCode.Ecc.HIGH]) { // From low to high
                if (boostEcl && dataUsedBits <= QrCode.getNumDataCodewords(version, newEcl) * 8)
                    ecl = newEcl;
            }
            // Concatenate all segments to create the data bit string
            let bb = [];
            for (const seg of segs) {
                appendBits(seg.mode.modeBits, 4, bb);
                appendBits(seg.numChars, seg.mode.numCharCountBits(version), bb);
                for (const b of seg.getData())
                    bb.push(b);
            }
            assert(bb.length == dataUsedBits);
            // Add terminator and pad up to a byte if applicable
            const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8;
            assert(bb.length <= dataCapacityBits);
            appendBits(0, Math.min(4, dataCapacityBits - bb.length), bb);
            appendBits(0, (8 - bb.length % 8) % 8, bb);
            assert(bb.length % 8 == 0);
            // Pad with alternating bytes until data capacity is reached
            for (let padByte = 0xEC; bb.length < dataCapacityBits; padByte ^= 0xEC ^ 0x11)
                appendBits(padByte, 8, bb);
            // Pack bits into bytes in big endian
            let dataCodewords = [];
            while (dataCodewords.length * 8 < bb.length)
                dataCodewords.push(0);
            bb.forEach((b, i) => dataCodewords[i >>> 3] |= b << (7 - (i & 7)));
            // Create the QR Code object
            return new QrCode(version, ecl, dataCodewords, mask);
        }
        /*-- Accessor methods --*/
        // Returns the color of the module (pixel) at the given coordinates, which is false
        // for light or true for dark. The top left corner has the coordinates (x=0, y=0).
        // If the given coordinates are out of bounds, then false (light) is returned.
        getModule(x, y) {
            return 0 <= x && x < this.size && 0 <= y && y < this.size && this.modules[y][x];
        }
        /*-- Private helper methods for constructor: Drawing function modules --*/
        // Reads this object's version field, and draws and marks all function modules.
        drawFunctionPatterns() {
            // Draw horizontal and vertical timing patterns
            for (let i = 0; i < this.size; i++) {
                this.setFunctionModule(6, i, i % 2 == 0);
                this.setFunctionModule(i, 6, i % 2 == 0);
            }
            // Draw 3 finder patterns (all corners except bottom right; overwrites some timing modules)
            this.drawFinderPattern(3, 3);
            this.drawFinderPattern(this.size - 4, 3);
            this.drawFinderPattern(3, this.size - 4);
            // Draw numerous alignment patterns
            const alignPatPos = this.getAlignmentPatternPositions();
            const numAlign = alignPatPos.length;
            for (let i = 0; i < numAlign; i++) {
                for (let j = 0; j < numAlign; j++) {
                    // Don't draw on the three finder corners
                    if (!(i == 0 && j == 0 || i == 0 && j == numAlign - 1 || i == numAlign - 1 && j == 0))
                        this.drawAlignmentPattern(alignPatPos[i], alignPatPos[j]);
                }
            }
            // Draw configuration data
            this.drawFormatBits(0); // Dummy mask value; overwritten later in the constructor
            this.drawVersion();
        }
        // Draws two copies of the format bits (with its own error correction code)
        // based on the given mask and this object's error correction level field.
        drawFormatBits(mask) {
            // Calculate error correction code and pack bits
            const data = this.errorCorrectionLevel.formatBits << 3 | mask; // errCorrLvl is uint2, mask is uint3
            let rem = data;
            for (let i = 0; i < 10; i++)
                rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            const bits = (data << 10 | rem) ^ 0x5412; // uint15
            assert(bits >>> 15 == 0);
            // Draw first copy
            for (let i = 0; i <= 5; i++)
                this.setFunctionModule(8, i, getBit(bits, i));
            this.setFunctionModule(8, 7, getBit(bits, 6));
            this.setFunctionModule(8, 8, getBit(bits, 7));
            this.setFunctionModule(7, 8, getBit(bits, 8));
            for (let i = 9; i < 15; i++)
                this.setFunctionModule(14 - i, 8, getBit(bits, i));
            // Draw second copy
            for (let i = 0; i < 8; i++)
                this.setFunctionModule(this.size - 1 - i, 8, getBit(bits, i));
            for (let i = 8; i < 15; i++)
                this.setFunctionModule(8, this.size - 15 + i, getBit(bits, i));
            this.setFunctionModule(8, this.size - 8, true); // Always dark
        }
        // Draws two copies of the version bits (with its own error correction code),
        // based on this object's version field, iff 7 <= version <= 40.
        drawVersion() {
            if (this.version < 7)
                return;
            // Calculate error correction code and pack bits
            let rem = this.version; // version is uint6, in the range [7, 40]
            for (let i = 0; i < 12; i++)
                rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
            const bits = this.version << 12 | rem; // uint18
            assert(bits >>> 18 == 0);
            // Draw two copies
            for (let i = 0; i < 18; i++) {
                const color = getBit(bits, i);
                const a = this.size - 11 + i % 3;
                const b = Math.floor(i / 3);
                this.setFunctionModule(a, b, color);
                this.setFunctionModule(b, a, color);
            }
        }
        // Draws a 9*9 finder pattern including the border separator,
        // with the center module at (x, y). Modules can be out of bounds.
        drawFinderPattern(x, y) {
            for (let dy = -4; dy <= 4; dy++) {
                for (let dx = -4; dx <= 4; dx++) {
                    const dist = Math.max(Math.abs(dx), Math.abs(dy)); // Chebyshev/infinity norm
                    const xx = x + dx;
                    const yy = y + dy;
                    if (0 <= xx && xx < this.size && 0 <= yy && yy < this.size)
                        this.setFunctionModule(xx, yy, dist != 2 && dist != 4);
                }
            }
        }
        // Draws a 5*5 alignment pattern, with the center module
        // at (x, y). All modules must be in bounds.
        drawAlignmentPattern(x, y) {
            for (let dy = -2; dy <= 2; dy++) {
                for (let dx = -2; dx <= 2; dx++)
                    this.setFunctionModule(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) != 1);
            }
        }
        // Sets the color of a module and marks it as a function module.
        // Only used by the constructor. Coordinates must be in bounds.
        setFunctionModule(x, y, isDark) {
            this.modules[y][x] = isDark;
            this.isFunction[y][x] = true;
        }
        /*-- Private helper methods for constructor: Codewords and masking --*/
        // Returns a new byte string representing the given data with the appropriate error correction
        // codewords appended to it, based on this object's version and error correction level.
        addEccAndInterleave(data) {
            const ver = this.version;
            const ecl = this.errorCorrectionLevel;
            if (data.length != QrCode.getNumDataCodewords(ver, ecl))
                throw new RangeError("Invalid argument");
            // Calculate parameter numbers
            const numBlocks = QrCode.NUM_ERROR_CORRECTION_BLOCKS[ecl.ordinal][ver];
            const blockEccLen = QrCode.ECC_CODEWORDS_PER_BLOCK[ecl.ordinal][ver];
            const rawCodewords = Math.floor(QrCode.getNumRawDataModules(ver) / 8);
            const numShortBlocks = numBlocks - rawCodewords % numBlocks;
            const shortBlockLen = Math.floor(rawCodewords / numBlocks);
            // Split data into blocks and append ECC to each block
            let blocks = [];
            const rsDiv = QrCode.reedSolomonComputeDivisor(blockEccLen);
            for (let i = 0, k = 0; i < numBlocks; i++) {
                let dat = data.slice(k, k + shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1));
                k += dat.length;
                const ecc = QrCode.reedSolomonComputeRemainder(dat, rsDiv);
                if (i < numShortBlocks)
                    dat.push(0);
                blocks.push(dat.concat(ecc));
            }
            // Interleave (not concatenate) the bytes from every block into a single sequence
            let result = [];
            for (let i = 0; i < blocks[0].length; i++) {
                blocks.forEach((block, j) => {
                    // Skip the padding byte in short blocks
                    if (i != shortBlockLen - blockEccLen || j >= numShortBlocks)
                        result.push(block[i]);
                });
            }
            assert(result.length == rawCodewords);
            return result;
        }
        // Draws the given sequence of 8-bit codewords (data and error correction) onto the entire
        // data area of this QR Code. Function modules need to be marked off before this is called.
        drawCodewords(data) {
            if (data.length != Math.floor(QrCode.getNumRawDataModules(this.version) / 8))
                throw new RangeError("Invalid argument");
            let i = 0; // Bit index into the data
            // Do the funny zigzag scan
            for (let right = this.size - 1; right >= 1; right -= 2) { // Index of right column in each column pair
                if (right == 6)
                    right = 5;
                for (let vert = 0; vert < this.size; vert++) { // Vertical counter
                    for (let j = 0; j < 2; j++) {
                        const x = right - j; // Actual x coordinate
                        const upward = ((right + 1) & 2) == 0;
                        const y = upward ? this.size - 1 - vert : vert; // Actual y coordinate
                        if (!this.isFunction[y][x] && i < data.length * 8) {
                            this.modules[y][x] = getBit(data[i >>> 3], 7 - (i & 7));
                            i++;
                        }
                        // If this QR Code has any remainder bits (0 to 7), they were assigned as
                        // 0/false/light by the constructor and are left unchanged by this method
                    }
                }
            }
            assert(i == data.length * 8);
        }
        // XORs the codeword modules in this QR Code with the given mask pattern.
        // The function modules must be marked and the codeword bits must be drawn
        // before masking. Due to the arithmetic of XOR, calling applyMask() with
        // the same mask value a second time will undo the mask. A final well-formed
        // QR Code needs exactly one (not zero, two, etc.) mask applied.
        applyMask(mask) {
            if (mask < 0 || mask > 7)
                throw new RangeError("Mask value out of range");
            for (let y = 0; y < this.size; y++) {
                for (let x = 0; x < this.size; x++) {
                    let invert;
                    switch (mask) {
                        case 0:
                            invert = (x + y) % 2 == 0;
                            break;
                        case 1:
                            invert = y % 2 == 0;
                            break;
                        case 2:
                            invert = x % 3 == 0;
                            break;
                        case 3:
                            invert = (x + y) % 3 == 0;
                            break;
                        case 4:
                            invert = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 == 0;
                            break;
                        case 5:
                            invert = x * y % 2 + x * y % 3 == 0;
                            break;
                        case 6:
                            invert = (x * y % 2 + x * y % 3) % 2 == 0;
                            break;
                        case 7:
                            invert = ((x + y) % 2 + x * y % 3) % 2 == 0;
                            break;
                        default: throw new Error("Unreachable");
                    }
                    if (!this.isFunction[y][x] && invert)
                        this.modules[y][x] = !this.modules[y][x];
                }
            }
        }
        // Calculates and returns the penalty score based on state of this QR Code's current modules.
        // This is used by the automatic mask choice algorithm to find the mask pattern that yields the lowest score.
        getPenaltyScore() {
            let result = 0;
            // Adjacent modules in row having same color, and finder-like patterns
            for (let y = 0; y < this.size; y++) {
                let runColor = false;
                let runX = 0;
                let runHistory = [0, 0, 0, 0, 0, 0, 0];
                for (let x = 0; x < this.size; x++) {
                    if (this.modules[y][x] == runColor) {
                        runX++;
                        if (runX == 5)
                            result += QrCode.PENALTY_N1;
                        else if (runX > 5)
                            result++;
                    }
                    else {
                        this.finderPenaltyAddHistory(runX, runHistory);
                        if (!runColor)
                            result += this.finderPenaltyCountPatterns(runHistory) * QrCode.PENALTY_N3;
                        runColor = this.modules[y][x];
                        runX = 1;
                    }
                }
                result += this.finderPenaltyTerminateAndCount(runColor, runX, runHistory) * QrCode.PENALTY_N3;
            }
            // Adjacent modules in column having same color, and finder-like patterns
            for (let x = 0; x < this.size; x++) {
                let runColor = false;
                let runY = 0;
                let runHistory = [0, 0, 0, 0, 0, 0, 0];
                for (let y = 0; y < this.size; y++) {
                    if (this.modules[y][x] == runColor) {
                        runY++;
                        if (runY == 5)
                            result += QrCode.PENALTY_N1;
                        else if (runY > 5)
                            result++;
                    }
                    else {
                        this.finderPenaltyAddHistory(runY, runHistory);
                        if (!runColor)
                            result += this.finderPenaltyCountPatterns(runHistory) * QrCode.PENALTY_N3;
                        runColor = this.modules[y][x];
                        runY = 1;
                    }
                }
                result += this.finderPenaltyTerminateAndCount(runColor, runY, runHistory) * QrCode.PENALTY_N3;
            }
            // 2*2 blocks of modules having same color
            for (let y = 0; y < this.size - 1; y++) {
                for (let x = 0; x < this.size - 1; x++) {
                    const color = this.modules[y][x];
                    if (color == this.modules[y][x + 1] &&
                        color == this.modules[y + 1][x] &&
                        color == this.modules[y + 1][x + 1])
                        result += QrCode.PENALTY_N2;
                }
            }
            // Balance of dark and light modules
            let dark = 0;
            for (const row of this.modules)
                dark = row.reduce((sum, color) => sum + (color ? 1 : 0), dark);
            const total = this.size * this.size; // Note that size is odd, so dark/total != 1/2
            // Compute the smallest integer k >= 0 such that (45-5k)% <= dark/total <= (55+5k)%
            const k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
            assert(0 <= k && k <= 9);
            result += k * QrCode.PENALTY_N4;
            assert(0 <= result && result <= 2568888); // Non-tight upper bound based on default values of PENALTY_N1, ..., N4
            return result;
        }
        /*-- Private helper functions --*/
        // Returns an ascending list of positions of alignment patterns for this version number.
        // Each position is in the range [0,177), and are used on both the x and y axes.
        // This could be implemented as lookup table of 40 variable-length lists of integers.
        getAlignmentPatternPositions() {
            if (this.version == 1)
                return [];
            else {
                const numAlign = Math.floor(this.version / 7) + 2;
                const step = (this.version == 32) ? 26 :
                    Math.ceil((this.version * 4 + 4) / (numAlign * 2 - 2)) * 2;
                let result = [6];
                for (let pos = this.size - 7; result.length < numAlign; pos -= step)
                    result.splice(1, 0, pos);
                return result;
            }
        }
        // Returns the number of data bits that can be stored in a QR Code of the given version number, after
        // all function modules are excluded. This includes remainder bits, so it might not be a multiple of 8.
        // The result is in the range [208, 29648]. This could be implemented as a 40-entry lookup table.
        static getNumRawDataModules(ver) {
            if (ver < QrCode.MIN_VERSION || ver > QrCode.MAX_VERSION)
                throw new RangeError("Version number out of range");
            let result = (16 * ver + 128) * ver + 64;
            if (ver >= 2) {
                const numAlign = Math.floor(ver / 7) + 2;
                result -= (25 * numAlign - 10) * numAlign - 55;
                if (ver >= 7)
                    result -= 36;
            }
            assert(208 <= result && result <= 29648);
            return result;
        }
        // Returns the number of 8-bit data (i.e. not error correction) codewords contained in any
        // QR Code of the given version number and error correction level, with remainder bits discarded.
        // This stateless pure function could be implemented as a (40*4)-cell lookup table.
        static getNumDataCodewords(ver, ecl) {
            return Math.floor(QrCode.getNumRawDataModules(ver) / 8) -
                QrCode.ECC_CODEWORDS_PER_BLOCK[ecl.ordinal][ver] *
                    QrCode.NUM_ERROR_CORRECTION_BLOCKS[ecl.ordinal][ver];
        }
        // Returns a Reed-Solomon ECC generator polynomial for the given degree. This could be
        // implemented as a lookup table over all possible parameter values, instead of as an algorithm.
        static reedSolomonComputeDivisor(degree) {
            if (degree < 1 || degree > 255)
                throw new RangeError("Degree out of range");
            // Polynomial coefficients are stored from highest to lowest power, excluding the leading term which is always 1.
            // For example the polynomial x^3 + 255x^2 + 8x + 93 is stored as the uint8 array [255, 8, 93].
            let result = [];
            for (let i = 0; i < degree - 1; i++)
                result.push(0);
            result.push(1); // Start off with the monomial x^0
            // Compute the product polynomial (x - r^0) * (x - r^1) * (x - r^2) * ... * (x - r^{degree-1}),
            // and drop the highest monomial term which is always 1x^degree.
            // Note that r = 0x02, which is a generator element of this field GF(2^8/0x11D).
            let root = 1;
            for (let i = 0; i < degree; i++) {
                // Multiply the current product by (x - r^i)
                for (let j = 0; j < result.length; j++) {
                    result[j] = QrCode.reedSolomonMultiply(result[j], root);
                    if (j + 1 < result.length)
                        result[j] ^= result[j + 1];
                }
                root = QrCode.reedSolomonMultiply(root, 0x02);
            }
            return result;
        }
        // Returns the Reed-Solomon error correction codeword for the given data and divisor polynomials.
        static reedSolomonComputeRemainder(data, divisor) {
            let result = divisor.map(_ => 0);
            for (const b of data) { // Polynomial division
                const factor = b ^ result.shift();
                result.push(0);
                divisor.forEach((coef, i) => result[i] ^= QrCode.reedSolomonMultiply(coef, factor));
            }
            return result;
        }
        // Returns the product of the two given field elements modulo GF(2^8/0x11D). The arguments and result
        // are unsigned 8-bit integers. This could be implemented as a lookup table of 256*256 entries of uint8.
        static reedSolomonMultiply(x, y) {
            if (x >>> 8 != 0 || y >>> 8 != 0)
                throw new RangeError("Byte out of range");
            // Russian peasant multiplication
            let z = 0;
            for (let i = 7; i >= 0; i--) {
                z = (z << 1) ^ ((z >>> 7) * 0x11D);
                z ^= ((y >>> i) & 1) * x;
            }
            assert(z >>> 8 == 0);
            return z;
        }
        // Can only be called immediately after a light run is added, and
        // returns either 0, 1, or 2. A helper function for getPenaltyScore().
        finderPenaltyCountPatterns(runHistory) {
            const n = runHistory[1];
            assert(n <= this.size * 3);
            const core = n > 0 && runHistory[2] == n && runHistory[3] == n * 3 && runHistory[4] == n && runHistory[5] == n;
            return (core && runHistory[0] >= n * 4 && runHistory[6] >= n ? 1 : 0)
                + (core && runHistory[6] >= n * 4 && runHistory[0] >= n ? 1 : 0);
        }
        // Must be called at the end of a line (row or column) of modules. A helper function for getPenaltyScore().
        finderPenaltyTerminateAndCount(currentRunColor, currentRunLength, runHistory) {
            if (currentRunColor) { // Terminate dark run
                this.finderPenaltyAddHistory(currentRunLength, runHistory);
                currentRunLength = 0;
            }
            currentRunLength += this.size; // Add light border to final run
            this.finderPenaltyAddHistory(currentRunLength, runHistory);

  }else{
    k2.appendChild(el("div","v",esc(fmtBytes(used))+' <small>использовано</small>'));
    k2.appendChild(el("div","s","без ограничений"));
  }
  k.appendChild(k2);c.appendChild(k);
  var ru=renewUrl();
  if(ru){var r=el("div","renew");var a=el("a","btn wide",esc(T("renew_text","Продлить подписку")));a.href=ru;a.target="_blank";a.rel="noopener";r.appendChild(a);c.appendChild(r);}
  root.appendChild(c);
}

/* ---- шаги ---- */
var how,SUPB=false;
function renderHow(root){how=el("div","card");how.id="how";root.appendChild(how);drawHow();}
function supLink(){
  var s=SP.support||{};
  if(s.tg)return [s.tg,"Напишите в поддержку"];
  if(s.site)return [s.site,"Напишите в поддержку"];
  if(D.support_url&&/^(https?|tg):\/\//i.test(D.support_url))return [D.support_url,D.support_text||"Напишите в поддержку"];
  return null;
}
function stepTitle(i,def,extra){var t=STEP(i).t;return t?ph(t,extra):def;}
function stepText(b,i,extra){var x=STEP(i).x;if(x)b.appendChild(rich(x,"sx",extra));}
function drawHow(){
  how.innerHTML="";
  how.appendChild(el("h2",null,esc(T("how_title","Как подключиться — 3 шага"))));
  how.appendChild(el("p","lead",esc(T("how_lead","Выберите своё устройство и сделайте три простых шага."))));
  if(!P.length){how.appendChild(el("p",null,"Скопируйте ссылку подписки и добавьте её в VPN-приложение."));return;}
  var tabs=el("div","tabs");tabs.setAttribute("role","tablist");tabs.setAttribute("aria-label","Устройство");
  P.forEach(function(p){
    var b=el("button","tab",esc(p.t));b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",p.id===cur?"true":"false");
    b.onclick=function(){cur=p.id;app=null;lsSet("h1sub_plat",p.id);drawHow();var t=how.querySelector(".tab[aria-selected=true]");if(t&&t.focus)t.focus();};
    tabs.appendChild(b);
  });
  if(P.length>1)how.appendChild(tabs);
  if(P.length>1)how.appendChild(el("p","detected",cur===DET?"Определили автоматически: "+esc(DETT)+". Если не так — выберите вкладку выше.":"Ваше устройство похоже на "+esc(DETT)+"."));
  var pl=platOf(cur),list=pl.apps;
  if(!app||!list.some(function(x){return x.id===app;}))app=list[0].id;
  var it=null;list.forEach(function(x){if(x.id===app)it=x;});
  var ex={app:it?it.n:"приложение"};
  var ol=el("ol","steps");
  /* шаг 1 */
  var s1=el("li","step");s1.appendChild(el("div","num","1"));var b1=el("div");
  b1.appendChild(el("h3",null,esc(stepTitle(0,"Установите приложение",ex))));
  stepText(b1,0,ex);
  var apps=el("div","apps");
  list.forEach(function(a){
    var lab=el("label","app"+(a.id===app?" sel":""));
    var inp=document.createElement("input");inp.type="radio";inp.name="h1app";inp.checked=a.id===app;inp.onchange=function(){app=a.id;drawHow();};
    lab.appendChild(inp);
    var nm=el("div","nm");var bb=el("b");
    if(a.icon&&/^(data:image\/|https:\/\/)/i.test(a.icon)){var im=document.createElement("img");im.className="ic";im.alt="";im.src=a.icon;bb.appendChild(im);}
    bb.appendChild(document.createTextNode(a.n));
    if(a.rec)bb.appendChild(el("span","rec","рекомендуем"));
    nm.appendChild(bb);nm.appendChild(el("span",null,esc(a.note||"")));lab.appendChild(nm);
    var g=el("div","get");
    (a.get||[]).forEach(function(l){if(!/^https?:\/\//i.test(l[1]||""))return;var x=el("a","btn sm",(l[2]?IC_DL:"")+esc(l[0]));x.href=l[1];x.target="_blank";x.rel="noopener";x.onclick=function(e){e.stopPropagation();};g.appendChild(x);});
    lab.appendChild(g);apps.appendChild(lab);
  });
  b1.appendChild(apps);
  b1.appendChild(el("p","hint","Уже установлено — сразу переходите к шагу 2."));
  s1.appendChild(b1);ol.appendChild(s1);
  /* шаг 2 */
  var s2=el("li","step");s2.appendChild(el("div","num","2"));var b2=el("div");
  b2.appendChild(el("h3",null,esc(stepTitle(1,"Добавьте подписку в "+(it?it.n:"приложение"),ex))));
  stepText(b2,1,ex);
  var add=it&&it.add&&!/^(javascript|data|vbscript):/i.test(it.add)?it.add:"";
  if(cur==="tv"){
    b2.appendChild(el("p",null,"На телевизоре откройте приложение и нажмите «+» → «Добавить подписку» (или «Импорт по ссылке»), затем вставьте или введите ссылку ниже. Проще всего открыть эту страницу в браузере телевизора и нажать «Скопировать ссылку»."));
    var lk=el("div","lrow");lk.appendChild(el("span","txt",esc(SUB)));lk.style.userSelect="all";b2.appendChild(lk);
    var qb=el("div","qrbox");var cv=document.createElement("canvas");qb.appendChild(cv);
    qb.appendChild(el("p",null,"QR-код ссылки подписки — если приложение умеет сканировать или принимает ссылку с телефона."));
    try{drawQR(cv,SUB,150);b2.appendChild(qb);}catch(e){}
    var cb=el("button","btn wide",IC_COPY+" Скопировать ссылку");cb.type="button";cb.style.marginTop="8px";cb.onclick=function(){copy(SUB,"Ссылка скопирована — вставьте её в приложение");};
    b2.appendChild(cb);
  }else{
    if(add){
      var a2=el("a","btn primary wide",IC_PLUS+" Добавить в "+esc(it.n));a2.href=add;a2.rel="noopener";
      b2.appendChild(a2);
      b2.appendChild(el("p","hint","Кнопка откроет "+esc(it.n)+" и сама добавит подписку. Если ничего не произошло — скопируйте ссылку и в приложении нажмите «+» → «Вставить из буфера» (или «Импорт из буфера обмена»)."));
    }else{
      b2.appendChild(el("p",null,"Скопируйте ссылку и в приложении нажмите «+» → «Вставить из буфера» (или «Добавить подписку» → вставьте ссылку)."));
    }
    var r2=el("div","row2");
    var cb2=el("button","btn",IC_COPY+" Скопировать ссылку");cb2.type="button";cb2.onclick=function(){copy(SUB,"Ссылка скопирована — вставьте её в приложение");};
    var qb2=el("button","btn",IC_QR+" QR-код");qb2.type="button";qb2.onclick=function(){showQR("Отсканируйте в приложении",SUB);};
    r2.appendChild(cb2);r2.appendChild(qb2);b2.appendChild(r2);
    b2.appendChild(el("p","hint","QR-код удобен, если эта страница открыта на компьютере, а подключаете телефон: в приложении нажмите «+» → «Сканировать QR-код»."));
  }
  if(it&&(it.guide||(it.shots&&it.shots.length))){
    var gd=el("div","guide");gd.appendChild(el("h4",null,"Инструкция для "+esc(it.n)));
    if(it.guide)gd.appendChild(rich(it.guide,null,ex));
    if(it.shots&&it.shots.length){var sh=el("div","shots");it.shots.forEach(function(u,i){if(!/^https:\/\//i.test(u))return;var a3=el("a");a3.href=u;a3.target="_blank";a3.rel="noopener";var im=document.createElement("img");im.src=u;im.alt="Скриншот "+(i+1);im.loading="lazy";a3.appendChild(im);sh.appendChild(a3);});gd.appendChild(sh);}
    b2.appendChild(gd);
  }
  s2.appendChild(b2);ol.appendChild(s2);
  /* шаг 3 */
  var s3=el("li","step");s3.appendChild(el("div","num","3"));var b3=el("div");
  b3.appendChild(el("h3",null,esc(stepTitle(2,"Включите VPN",ex))));
  stepText(b3,2,ex);
  var who={windows:"Windows",macos:"macOS",tv:"телевизор",linux:"система"}[cur]||"телефон";
  b3.appendChild(el("p",null,"В приложении нажмите большую кнопку подключения. Если "+(cur==="windows"||cur==="macos"||cur==="linux"?"система спросит разрешение (на macOS — «Добавить конфигурацию VPN»)":esc(who)+" спросит разрешение на VPN")+" — разрешите."));
  b3.appendChild(el("p","hint","Не подключается? Выберите в приложении другой сервер из списка и попробуйте снова. Если серверы поменялись — обновите подписку в приложении (значок ⟳)."));
  s3.appendChild(b3);ol.appendChild(s3);
  how.appendChild(ol);
  var sl=SUPB?null:supLink();
  if(sl){
    var spp=el("p","hint");spp.style.marginTop="14px";spp.appendChild(document.createTextNode("Не получается? "));
    var sa=el("a",null,esc(sl[1]));sa.href=sl[0];sa.target="_blank";sa.rel="noopener";spp.appendChild(sa);how.appendChild(spp);
  }
}

/* ---- QR-код подписки ---- */
function renderQR(root){
  if(!SUB)return;
  var c=el("div","card");c.appendChild(el("h2",null,"QR-код подписки"));
  var w=el("div","qrcard");var cv=document.createElement("canvas");
  try{drawQR(cv,SUB,180);}catch(e){return;}
  w.appendChild(cv);var t=el("div","qt");
  t.appendChild(el("p",null,"Откройте VPN-приложение на телефоне, нажмите «+» → «Сканировать QR-код» и наведите камеру на этот код."));
  var b=el("button","btn",IC_COPY+" Скопировать ссылку");b.type="button";b.onclick=function(){copy(SUB,"Ссылка скопирована — вставьте её в приложение");};
  t.appendChild(b);w.appendChild(t);c.appendChild(w);root.appendChild(c);
}

/* ---- серверы ---- */
function renderServers(root){
  var cf=D.configs||[];if(!cf.length)return;
  var c=el("div","card");
  c.appendChild(el("h2",null,"Серверы в подписке"));
  c.appendChild(el("p","lead",cf.length+" "+plural(cf.length,"сервер","сервера","серверов")+" — приложение покажет их списком, выбирайте любой."));
  var ul=el("ul","srv");
  cf.forEach(function(x){var li=el("li");li.appendChild(el("div","t","<b>"+esc(nameOf(x))+"</b><span>"+esc(techOf(x))+"</span>"));ul.appendChild(li);});
  c.appendChild(ul);root.appendChild(c);
}

/* ---- для продвинутых ---- */
function lrow(tags,text,title,url){
  var r=el("div","lrow");tags.forEach(function(t){r.appendChild(el("span","tag "+(t[1]||""),esc(t[0])));});
  r.appendChild(el("span","txt",esc(text)));
  var b1=el("button","ib",IC_COPY);b1.type="button";b1.title="Копировать";b1.setAttribute("aria-label","Копировать "+title);b1.onclick=function(){copy(url);};
  var b2=el("button","ib",IC_QR);b2.type="button";b2.title="QR-код";b2.setAttribute("aria-label","QR-код "+title);b2.onclick=function(){showQR(title,url);};
  r.appendChild(b1);r.appendChild(b2);return r;
}
function renderAdv(root){
  var d=el("details","card adv");
  var sm=el("summary",null,"<span>Для продвинутых<small>ссылки, JSON, Clash, QR-коды, отдельные конфиги</small></span>");d.appendChild(sm);
  var b=el("div","advb");
  var t=el("table","kv");
  function tr(k,v){var r=el("tr");r.appendChild(el("td","k",esc(k)));r.appendChild(el("td","v",v));t.appendChild(r);}
  tr("ID подписки",esc(D.id));tr("Клиент",esc(D.email));tr("Статус",esc(D.status));
  tr("Использовано",esc(fmtBytes(D.used_bytes)));tr("Лимит",D.limit_bytes>0?esc(fmtBytes(D.limit_bytes)):"∞");
  tr("Был(а) в сети",esc(fmtFull(D.last_online)));tr("Срок действия",D.expires_at>0?esc(fmtFull(D.expires_at)):"Бессрочно");
  b.appendChild(t);
  b.appendChild(el("div","sec","Ссылки подписки"));
  var lk=D.links||{};
  [["SUB","sub",lk.sub,"Подписка (для любых приложений)"],["JSON","",lk.json,"Xray JSON"],["CLASH","",lk.clash,"Clash / Mihomo"]].forEach(function(x){if(x[2])b.appendChild(lrow([[x[0],x[1]]],x[3],x[0],x[2]));});
  var cf=D.configs||[];
  if(cf.length){
    b.appendChild(el("div","sec","Отдельные конфигурации"));
    var all=el("button","btn wide",IC_COPY+" Копировать все конфигурации");all.type="button";all.style.marginBottom="8px";
    all.onclick=function(){copy(cf.map(function(x){return x.link;}).join("\n"));};b.appendChild(all);
    cf.forEach(function(x){var r=lrow([],nameOf(x),x.tag||"config",x.link),t2=r.querySelector(".txt");t2.innerHTML="<b>"+esc(nameOf(x))+"</b><small>"+esc(techOf(x))+"</small>";b.appendChild(r);});
  }
  d.appendChild(b);root.appendChild(d);
}

/* ---- поддержка ---- */
function renderSupport(root){
  var s=SP.support||{},btns=[];
  if(s.tg&&/^https?:\/\//i.test(s.tg))btns.push([s.tg,IC_TG,"Telegram"]);
  if(s.site&&/^https?:\/\//i.test(s.site))btns.push([s.site,IC_WEB,"Сайт"]);
  if(s.email&&/^[^\s@<>"]+@[^\s@<>"]+$/.test(s.email))btns.push(["mailto:"+s.email,IC_MAIL,"Почта"]);
  if(!btns.length){var sl=supLink();if(sl)btns.push([sl[0],IC_TG,sl[1]]);}
  if(!btns.length&&!s.text)return;
  SUPB=true;
  var c=el("div","card");c.id="support";c.appendChild(el("h2",null,"Поддержка"));
  c.appendChild(s.text?rich(s.text):el("p","lead","Если что-то не получается — напишите нам, поможем подключиться."));
  var w=el("div","sup");
  btns.forEach(function(x){var a=el("a","btn",x[1]+" "+esc(x[2]));a.href=x[0];if(!/^mailto:/i.test(x[0])){a.target="_blank";a.rel="noopener";}w.appendChild(a);});
  if(btns.length)c.appendChild(w);
  root.appendChild(c);
}

/* ---- FAQ ---- */
function renderFaq(root){
  var f=(SP.faq||[]).filter(function(x){return x&&(x.q||x.a);});if(!f.length)return;
  var c=el("div","card faq");c.appendChild(el("h2",null,"Частые вопросы"));
  f.forEach(function(x){var d=el("details");var s=el("summary");s.textContent=ph(x.q||"Вопрос");d.appendChild(s);if(x.a)d.appendChild(rich(x.a));c.appendChild(d);});
  root.appendChild(c);
}

function render(){
  var root=document.getElementById("app");root.innerHTML="";
  var top=el("div","top");
  if(SP.logo&&/^data:image\//i.test(SP.logo)){var lg=el("div","logo img");var im=document.createElement("img");im.src=SP.logo;im.alt=BRAND||"Логотип";lg.appendChild(im);top.appendChild(lg);}
  else top.appendChild(el("div","logo",esc((BRAND||"V").replace(/^[^0-9A-Za-zА-Яа-яЁё]+/,"").charAt(0).toUpperCase()||"V")));
  var h=el("div");h.appendChild(el("h1",null,esc(T("title",BRAND||"Ваша VPN-подписка"))));
  var sub=SP.t&&SP.t.subtitle;
  if(sub)h.appendChild(el("div","sub",esc(ph(sub))));
  else if(D.email&&D.email!=="—")h.appendChild(el("div","who","Подписка: "+esc(D.email)));
  top.appendChild(h);root.appendChild(top);
  var n=SP.notice;
  if(n&&n.text&&(!n.until||n.until>NOW)){var nb=el("div","notice "+(n.kind==="warn"?"warn":"info"));nb.setAttribute("role",n.kind==="warn"?"alert":"status");nb.appendChild(rich(n.text,"nb"));root.appendChild(nb);}
  if(SP.t&&SP.t.greeting){var g=el("div","card greet");g.appendChild(rich(SP.t.greeting));root.appendChild(g);}
  var B=SP.blocks&&SP.blocks.length?SP.blocks:[["status",1],["steps",1],["servers",1],["adv",1]];
  var on={};B.forEach(function(x){if(x[1])on[x[0]]=1;});
  if(on.support){var s=SP.support||{};SUPB=!!(s.tg||s.site||s.email||s.text||supLink());}
  var F={status:renderStatus,steps:renderHow,qr:renderQR,servers:renderServers,adv:renderAdv,support:renderSupport,faq:renderFaq};
  B.forEach(function(x){if(x[1]&&F[x[0]])F[x[0]](root);});
  var f=el("div","foot");
  if(SP.t&&SP.t.footer)f.appendChild(rich(SP.t.footer));
  else f.appendChild(el("div",null,esc(D.node||"")+(D.node?" • ":"")+"H1Cloud"));
  if(SP.classic!==false){var ov=el("a",null,"Открыть старый вид страницы");ov.href="?view=classic";f.appendChild(ov);}
  root.appendChild(f);
  if(SP.t&&SP.t.title&&SP.t.title.indexOf("{")>=0)document.title=ph(SP.t.title);
}
render();
})();
</script>
