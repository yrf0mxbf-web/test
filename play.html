<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра — Strovo</title>
    <!-- Нужен для /games/код/имя — иначе css/images ломаются -->
    <base href="/">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <style>
        .play-page { display: flex; flex-direction: column; height: 100vh; background: var(--bg); }
        .play-header {
            display: flex; align-items: center; gap: 16px;
            padding: 12px 24px; background: var(--bg-light);
            border-bottom: 1px solid var(--border);
        }
        .play-header h1 { font-size: 18px; font-weight: 700; }
        .play-header .author {
            display: flex; align-items: center; gap: 8px;
            color: var(--text-muted); font-size: 13px;
        }
        .play-header .author-avatar {
            width: 24px; height: 24px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: white;
        }
        .play-stats { display: flex; gap: 16px; margin-left: auto; align-items: center; }
        .play-stat { font-size: 13px; color: var(--text-muted); }
        .play-stat strong { color: var(--text); }
        .play-canvas-container { flex: 1; position: relative; background: #0a0a0f; }
        .play-hint {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 8px 18px; border-radius: 100px;
            font-size: 12px; color: var(--text-muted); pointer-events: none;
        }
        .play-actions {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px;
        }
        .play-btn {
            padding: 12px 28px; border-radius: var(--radius);
            font-size: 14px; font-weight: 600; cursor: pointer;
            border: none; transition: var(--transition);
        }
        .play-btn-like { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
        .play-btn-like:hover { border-color: var(--primary); }
        .play-btn-like.liked { background: var(--primary); border-color: var(--primary); color: white; }
        .play-btn-studio { background: var(--secondary); color: white; }
        .play-btn-studio:hover { opacity: 0.9; }
        .loading-overlay {
            position: absolute; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.5s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 48px; height: 48px; border: 3px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== SETTINGS ===== */
        .btn-icon {
            width: 34px; height: 34px; border-radius: var(--radius-sm);
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer;
        }
        .btn-icon:hover { border-color: var(--primary); }
        .settings-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: none; align-items: center; justify-content: center; z-index: 300;
        }
        .settings-overlay.open { display: flex; }
        .settings-panel {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 24px; width: 340px; max-width: 90vw;
        }
        .settings-panel h2 { font-size: 16px; margin-bottom: 16px; }
        .settings-row { margin-bottom: 16px; }
        .settings-row label {
            display: flex; justify-content: space-between; font-size: 13px;
            color: var(--text-muted); margin-bottom: 6px;
        }
        .settings-row input[type=range] { width: 100%; }
        .settings-row-inline { display: flex; align-items: center; justify-content: space-between; }
        .settings-close {
            width: 100%; margin-top: 8px; padding: 10px; border-radius: var(--radius-sm);
            background: var(--primary); border: none; color: white; font-weight: 700; cursor: pointer;
        }
        .switch { position: relative; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .track {
            position: absolute; inset: 0; background: var(--border); border-radius: 100px;
            transition: var(--transition); cursor: pointer;
        }
        .switch .track::before {
            content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
            background: white; border-radius: 50%; transition: var(--transition);
        }
        .switch input:checked + .track { background: var(--success); }
        .switch input:checked + .track::before { transform: translateX(18px); }

        /* ===== CHAT ===== */
        .chat-panel {
            position: absolute; bottom: 24px; left: 24px; width: 300px;
            background: rgba(13,13,13,0.75); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: var(--radius);
            display: flex; flex-direction: column; max-height: 320px; overflow: hidden;
            transition: opacity 0.2s;
        }
        .chat-panel.hidden { display: none; }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
            font-size: 13px; max-height: 220px;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .chat-msg { line-height: 1.35; word-wrap: break-word; }
        .chat-msg .chat-user { font-weight: 700; margin-right: 4px; }

        .chat-msg .chat-user.admin { color: var(--primary); }
        .chat-msg .chat-user.admin::before { content: '🛡️ '; }
        .chat-msg .chat-text { color: var(--text); }
        .chat-system { color: var(--text-muted); font-style: italic; font-size: 12px; }
        .chat-input-row { display: flex; border-top: 1px solid var(--border); }
        .chat-input-row input {
            flex: 1; background: transparent; border: none; color: var(--text);
            padding: 10px 12px; font-size: 13px; outline: none;
        }
        .chat-input-row button {
            background: var(--primary); border: none; color: white; padding: 0 16px; cursor: pointer; font-weight: 700;
        }
        .chat-input-row button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ===== PLAYERS LIST ===== */
        .players-panel {
            position: absolute; top: 16px; right: 16px; width: 200px;
            background: rgba(13,13,13,0.8); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: var(--radius);
            overflow: hidden; z-index: 20;
        }
        .players-panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; border-bottom: 1px solid var(--border);

        .player-row.me .player-name { color: var(--secondary); }
        .player-row .player-voice {
            margin-left: auto; font-size: 12px; opacity: 0.35;
        }
        .player-row .player-voice.on { opacity: 1; animation: voicePulse 1s ease infinite; }
        @keyframes voicePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .players-empty { padding: 10px 12px; font-size: 12px; color: var(--text-muted); font-style: italic; }

        .btn-voice {
            width: 34px; height: 34px; border-radius: var(--radius-sm);
            background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer;
        }
        .btn-voice:hover { border-color: var(--primary); }
        .btn-voice.active {
            background: rgba(0,210,106,0.2); border-color: var(--success); color: var(--success);
        }
        .btn-voice.muted {
            background: rgba(255,71,87,0.15); border-color: rgba(255,71,87,0.5); color: #ff6b7a;
        }
        .voice-status {
            font-size: 11px; color: var(--text-muted); max-width: 120px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .voice-status.on { color: var(--success); }

        .btn-exit {
            padding: 6px 12px; border-radius: var(--radius-sm);
            background: rgba(255,71,87,0.15); border: 1px solid rgba(255,71,87,0.4);
            color: #ff6b7a; font-size: 12px; font-weight: 700; cursor: pointer;
            white-space: nowrap;
        }
        .btn-exit:hover { background: rgba(255,71,87,0.3); }
        .settings-exit {
            width: 100%; margin-top: 10px; padding: 10px; border-radius: var(--radius-sm);
            background: rgba(255,71,87,0.15); border: 1px solid rgba(255,71,87,0.4);
            color: #ff6b7a; font-weight: 700; cursor: pointer; font-size: 14px;
        }
        .settings-exit:hover { background: rgba(255,71,87,0.3); }

        /* ===== MOBILE PLAY ===== */
        @media (max-width: 768px) {
            .play-header {
                padding: 8px 12px;
                gap: 8px;
                flex-wrap: wrap;
            }
            .play-header h1 {
                font-size: 14px;
                max-width: 40vw;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .play-header .author { font-size: 11px; }
            .play-stats { gap: 8px; }
            .play-stat { font-size: 11px; }
            .play-hint {
                font-size: 11px;
                padding: 6px 12px;
                top: 8px;
                max-width: 90%;
                text-align: center;
            }
            .chat-panel {
                left: 8px;
                right: 8px;
                bottom: 80px;
                width: auto;
                max-height: 40vh;
            }
            .chat-messages {
                max-height: 28vh;
                font-size: 12px;
            }
            .play-actions {
                bottom: 12px;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
                width: 95%;
            }
            .play-btn {
                padding: 10px 16px;
                font-size: 13px;
            }
            .settings-panel {
                width: 92vw;
                padding: 20px 16px;
            }
            .players-panel {
                top: auto; bottom: auto;
                right: 8px; left: auto;
                width: 160px;
                max-height: 30vh;
            }
            .players-list { max-height: 120px; }
            .btn-exit { padding: 5px 8px; font-size: 11px; }
        }
        @media (max-width: 480px) {
            .play-header .author { display: none; }
            .play-stat { display: none; }
            .play-stats .btn-icon { margin-left: auto; }
            .players-panel { display: none; }
            .players-panel.force-show { display: block; top: 8px; right: 8px; }
        }
    </style>

    <div class="play-header">

        <h1 id="gameName">Загрузка...</h1>
        <div class="author">

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const API_URL = window.location.origin;
    const params = new URLSearchParams(window.location.search);
    // Поддержка /games/123456/name-owner и play.html?id=...
    let gameId = params.get('id');
    let playCode = null;
    (function parsePrettyUrl() {
        const parts = location.pathname.split('/').filter(Boolean);
        if (parts.length >= 2 && parts[0] === 'games') {
            playCode = parts[1];
        }
    })();

    // Объявляем заранее — loadGame и presence используют эти переменные
    let myUsername = null;
    let myAvatarParts = null;
    let presenceTimer = null;
    const otherPlayers = new Map();

    if (!gameId && !playCode) {
        document.getElementById('gameName').textContent = 'Игра не найдена';
        document.getElementById('loading').innerHTML = '<p style="color:#ff4757;">ID игры не указан</p>';
    }

    const container = document.getElementById('canvasContainer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.maxDistance = 40;
    controls.minDistance = 3;
    controls.enablePan = false;
    // Персонаж двигается по WASD, поэтому ЛКМ камере не нужна — она только вращает (ПКМ) и зумит (колесо/средняя).
    controls.mouseButtons = {
        LEFT: null,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.ROTATE
    };

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    // Заполняющий свет — чтобы блоки не были чёрными с нижней/боковой стороны
    const hemiLight = new THREE.HemisphereLight(0xb1e1ff, 0xb97a20, 0.45);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.05);
    dirLight.position.set(15, 25, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // Sky
    const skyGeo = new THREE.SphereGeometry(200, 32, 32);
    const skyMat = new THREE.MeshBasicMaterial({ color: 0x87CEEB, side: THREE.BackSide });
    const sky = new THREE.Mesh(skyGeo, skyMat);
    scene.add(sky);

    // Clouds
    const cloudGroup = new THREE.Group();
    function createCloud(x, y, z) {
        const geo = new THREE.SphereGeometry(3, 8, 8);
        const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
        const cloud = new THREE.Group();
        for (let i = 0; i < 5; i++) {
            const puff = new THREE.Mesh(geo, mat);
            puff.position.set((Math.random()-0.5)*4, (Math.random()-0.5)*1, (Math.random()-0.5)*3);
            puff.scale.setScalar(0.5 + Math.random()*0.5);
            cloud.add(puff);
        }
        cloud.position.set(x, y, z);
        return cloud;
    }
    for (let i = 0; i < 12; i++) {
        cloudGroup.add(createCloud((Math.random()-0.5)*120, 30 + Math.random()*20, (Math.random()-0.5)*120));
    }
    scene.add(cloudGroup);

    // Rain (weather)
    function createRain(count) {
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const speeds = new Float32Array(count);
        for (let i = 0; i < count; i++) {
            positions[i*3]     = (Math.random() - 0.5) * 90;
            positions[i*3 + 1] = Math.random() * 40;
            positions[i*3 + 2] = (Math.random() - 0.5) * 90;
            speeds[i] = 0.35 + Math.random() * 0.35;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({ color: 0xaad4ff, size: 0.18, transparent: true, opacity: 0.65, sizeAttenuation: true });
        const points = new THREE.Points(geo, mat);
        points.visible = false;
        points.userData.speeds = speeds;
        return points;
    }
    const rain = createRain(700);
    scene.add(rain);

    function setRain(on) {
        rain.visible = !!on;
    }

    function updateRain(dt) {
        if (!rain.visible) return;
        const pos = rain.geometry.attributes.position;
        const speeds = rain.userData.speeds;
        const fall = dt * 30;
        for (let i = 0; i < pos.count; i++) {
            let y = pos.getY(i) - speeds[i] * fall;
            if (y < 0) y = 35 + Math.random() * 5;
            pos.setY(i, y);
        }
        pos.needsUpdate = true;
    }

    const gridHelper = new THREE.GridHelper(60, 60, 0x555560, 0x333340);
    scene.add(gridHelper);

    const groundGeo = new THREE.PlaneGeometry(300, 300);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    function getMaterial(color, matType) {
        let c;
        try {
            c = new THREE.Color(color || '#ff6b00');
        } catch (_) {
            c = new THREE.Color('#ff6b00');
        }
        // Важно: без envMap высокий metalness даёт почти чёрные блоки — не задираем metalness
        switch(matType) {
            case 'metal': return new THREE.MeshStandardMaterial({ color: c, roughness: 0.35, metalness: 0.55, envMapIntensity: 1 });
            case 'glow': return new THREE.MeshStandardMaterial({ color: c, roughness: 0.45, metalness: 0, emissive: c, emissiveIntensity: 0.65 });
            case 'glass': return new THREE.MeshStandardMaterial({ color: c, roughness: 0.15, metalness: 0.05, transparent: true, opacity: 0.5 });
            case 'wood': return new THREE.MeshStandardMaterial({ color: c, roughness: 0.92, metalness: 0 });
            case 'stone': return new THREE.MeshStandardMaterial({ color: c, roughness: 0.95, metalness: 0.05 });
            default: return new THREE.MeshStandardMaterial({ color: c, roughness: 0.45, metalness: 0.05 });
        }
    }

    const timeSettings = {
        day: { bg: 0x87CEEB, fog: 0x87CEEB, sky: 0x87CEEB, ambient: 0.65, dir: 1.05, ground: 0x2d5a27 },
        sunset: { bg: 0xff7e5f, fog: 0xff7e5f, sky: 0xff7e5f, ambient: 0.5, dir: 0.8, ground: 0x5a3a27 },
        // Ночь не должна быть «кромешной» — иначе блоки кажутся чёрными
        night: { bg: 0x0a0a1a, fog: 0x0a0a1a, sky: 0x0a0a1a, ambient: 0.4, dir: 0.45, ground: 0x1a1a2a }
    };

    function setTimeOfDay(time) {
        const s = timeSettings[time] || timeSettings.day;
        scene.background.setHex(s.bg);
        scene.fog.color.setHex(s.fog);
        sky.material.color.setHex(s.sky);
        ambientLight.intensity = s.ambient;
        dirLight.intensity = s.dir;
        ground.material.color.setHex(s.ground);
        cloudGroup.visible = (time !== 'night');
    }

    // ==================== ПЕРСОНАЖ ИГРОКА (3D) ====================
    const blockMeshes = [];

    function makeCharPart(w, h, d, color) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.05 }));
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
    }

    function buildCharacter(colors) {
        const group = new THREE.Group();
        const legH = 0.7, torsoH = 0.6, headS = 0.45, armH = 0.65;

        const legL = makeCharPart(0.28, legH, 0.28, colors.left_leg || '#3742fa');
        legL.position.set(-0.18, legH / 2, 0);
        const legR = makeCharPart(0.28, legH, 0.28, colors.right_leg || '#3742fa');
        legR.position.set(0.18, legH / 2, 0);

        const torso = makeCharPart(0.6, torsoH, 0.32, colors.torso || '#ff6b00');
        torso.position.set(0, legH + torsoH / 2, 0);

        const armL = makeCharPart(0.22, armH, 0.22, colors.left_arm || '#ffdbac');
        armL.position.set(-0.44, legH + torsoH - armH / 2, 0);
        const armR = makeCharPart(0.22, armH, 0.22, colors.right_arm || '#ffdbac');
        armR.position.set(0.44, legH + torsoH - armH / 2, 0);

        const head = makeCharPart(headS, headS, headS, colors.head || '#ffdbac');
        head.position.set(0, legH + torsoH + headS / 2, 0);

        group.add(legL, legR, torso, armL, armR, head);
        group.userData = { legL, legR, armL, armR };
        return group;
    }

    let character = null;
    let charVelocityY = 0;
    let onGround = false;
    const GRAVITY = 18;
    const MOVE_SPEED = 4.2;
    const JUMP_SPEED = 7;
    const clock = new THREE.Clock();

    const keys = {};
    window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        keys[e.code] = true;
        if (e.code === 'Space') e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        keys[e.code] = false;
    });

    // Размер персонажа для коллизий
    const CHAR_RADIUS = 0.25;
    const CHAR_HEIGHT = 1.65;
    const STEP_HEIGHT = 0.6;

    // Высота пола под точкой (верх блоков + земля). Считаем по AABB, без raycast —
    // raycast изнутри блока часто «ломается» и игрок застревает.
    function groundHeightAt(x, z) {
        let top = 0; // земля y=0
        for (let i = 0; i < blockMeshes.length; i++) {
            const b = blockMeshes[i];
            const bx = b.position.x, by = b.position.y, bz = b.position.z;
            if (Math.abs(x - bx) <= 0.5 + CHAR_RADIUS * 0.15 &&
                Math.abs(z - bz) <= 0.5 + CHAR_RADIUS * 0.15) {
                const bMaxY = by + 0.5;
                if (bMaxY > top) top = bMaxY;
            }
        }
        return top;
    }

    // Есть ли твёрдая стена в этой позиции (блоки, которые не являются полом под ногами)
    function solidBlockedAt(x, y, z) {
        const feet = y;
        const bodyMinY = feet + 0.12;
        const bodyMaxY = feet + CHAR_HEIGHT - 0.05;

        for (let i = 0; i < blockMeshes.length; i++) {
            const b = blockMeshes[i];
            const bx = b.position.x, by = b.position.y, bz = b.position.z;
            const bMinX = bx - 0.5, bMaxX = bx + 0.5;
            const bMinY = by - 0.5, bMaxY = by + 0.5;
            const bMinZ = bz - 0.5, bMaxZ = bz + 0.5;

            if (x + CHAR_RADIUS <= bMinX || x - CHAR_RADIUS >= bMaxX) continue;
            if (z + CHAR_RADIUS <= bMinZ || z - CHAR_RADIUS >= bMaxZ) continue;
            if (bodyMaxY <= bMinY || bodyMinY >= bMaxY) continue;

            // Пол / ступенька под ногами — не стена
            if (bMaxY <= feet + STEP_HEIGHT + 0.02) continue;

            return true;
        }
        return false;
    }

    // Вытолкнуть из блоков: вверх на поверхность + сдвиг по X/Z если всё ещё внутри
    function unstuckCharacter() {
        if (!character) return;
        let x = character.position.x;
        let y = character.position.y;
        let z = character.position.z;

        // 1) Поставить ноги на пол
        const floor = groundHeightAt(x, z);
        if (y < floor) {
            y = floor;
            charVelocityY = 0;
            onGround = true;
        }

        // 2) Если всё ещё пересекаем стену — сдвинуть в сторону наименьшего проникновения
        for (let pass = 0; pass < 4; pass++) {
            if (!solidBlockedAt(x, y, z)) break;

            let best = null; // { axis, delta }
            for (let i = 0; i < blockMeshes.length; i++) {
                const b = blockMeshes[i];
                const bx = b.position.x, by = b.position.y, bz = b.position.z;
                const bMinX = bx - 0.5, bMaxX = bx + 0.5;
                const bMinY = by - 0.5, bMaxY = by + 0.5;
                const bMinZ = bz - 0.5, bMaxZ = bz + 0.5;

                const bodyMinY = y + 0.12;
                const bodyMaxY = y + CHAR_HEIGHT - 0.05;
                if (x + CHAR_RADIUS <= bMinX || x - CHAR_RADIUS >= bMaxX) continue;
                if (z + CHAR_RADIUS <= bMinZ || z - CHAR_RADIUS >= bMaxZ) continue;
                if (bodyMaxY <= bMinY || bodyMinY >= bMaxY) continue;
                if (bMaxY <= y + STEP_HEIGHT + 0.02) continue; // пол

                // Глубина проникновения по каждой оси
                const penLeft = (x + CHAR_RADIUS) - bMinX;
                const penRight = bMaxX - (x - CHAR_RADIUS);
                const penDown = (z + CHAR_RADIUS) - bMinZ;
                const penUp = bMaxZ - (z - CHAR_RADIUS);
                const penTop = bMaxY - y; // вытолкнуть наверх на блок

                const candidates = [
                    { axis: 'x', delta: -penLeft - 0.01 },
                    { axis: 'x', delta: penRight + 0.01 },
                    { axis: 'z', delta: -penDown - 0.01 },
                    { axis: 'z', delta: penUp + 0.01 },
                    { axis: 'y', delta: penTop + 0.01 },
                ];
                for (const c of candidates) {
                    const mag = Math.abs(c.delta);
                    if (!best || mag < Math.abs(best.delta)) best = c;
                }
            }

            if (!best) break;
            if (best.axis === 'x') x += best.delta;
            else if (best.axis === 'z') z += best.delta;
            else if (best.axis === 'y') {
                y += best.delta;
                charVelocityY = 0;
                onGround = true;
            }
        }

        // 3) Финальный snap на пол в новой xz
        const floor2 = groundHeightAt(x, z);
        if (y < floor2) {
            y = floor2;
            charVelocityY = 0;
            onGround = true;
        }

        character.position.set(x, y, z);
    }

    function tryMove(dx, dz) {
        const x0 = character.position.x;
        const y0 = character.position.y;
        const z0 = character.position.z;

        // X
        const nx = x0 + dx;
        if (!solidBlockedAt(nx, y0, z0)) {
            character.position.x = nx;
        } else {
            // Попробовать зашагать вверх
            const stepY = y0 + STEP_HEIGHT;
            if (!solidBlockedAt(nx, stepY, z0)) {
                const floor = groundHeightAt(nx, z0);
                if (floor <= y0 + STEP_HEIGHT + 0.05) {
                    character.position.x = nx;
                    character.position.y = Math.max(y0, floor);
                    charVelocityY = 0;
                    onGround = true;
                }
            }
        }

        // Z
        const nz = z0 + dz;
        const y1 = character.position.y;
        if (!solidBlockedAt(character.position.x, y1, nz)) {
            character.position.z = nz;
        } else {
            const stepY = y1 + STEP_HEIGHT;
            if (!solidBlockedAt(character.position.x, stepY, nz)) {
                const floor = groundHeightAt(character.position.x, nz);
                if (floor <= y1 + STEP_HEIGHT + 0.05) {
                    character.position.z = nz;
                    character.position.y = Math.max(y1, floor);
                    charVelocityY = 0;
                    onGround = true;
                }
            }
        }
    }

    function updateCharacter(dt) {
        if (character) { character.rotation.x = 0; character.rotation.z = 0; }
        if (!character) return;

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        camDir.y = 0;
        if (camDir.lengthSq() > 0) camDir.normalize();
        const right = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();

        const moveVec = new THREE.Vector3();
        if (keys['KeyW'] || keys['ArrowUp']) moveVec.add(camDir);
        if (keys['KeyS'] || keys['ArrowDown']) moveVec.sub(camDir);
        if (keys['KeyD'] || keys['ArrowRight']) moveVec.add(right);
        if (keys['KeyA'] || keys['ArrowLeft']) moveVec.sub(right);

        const isMoving = moveVec.lengthSq() > 0;
        if (isMoving) {
            moveVec.normalize();
            const stepLen = Math.min(MOVE_SPEED * dt, 0.25);
            tryMove(moveVec.x * stepLen, moveVec.z * stepLen);

            const targetAngle = Math.atan2(moveVec.x, moveVec.z);
            let diff = targetAngle - character.rotation.y;
            diff = Math.atan2(Math.sin(diff), Math.cos(diff));
            character.rotation.y += diff * Math.min(1, dt * 10);
        }

        if (keys['Space'] && onGround) {
            charVelocityY = JUMP_SPEED;
            onGround = false;
        }

        // Гравитация
        charVelocityY -= GRAVITY * dt;
        character.position.y += charVelocityY * dt;

        // Пол
        const floor = groundHeightAt(character.position.x, character.position.z);
        if (character.position.y <= floor) {
            character.position.y = floor;
            charVelocityY = 0;
            onGround = true;
        } else {
            onGround = false;
        }

        // Потолок при прыжке
        if (charVelocityY > 0) {
            const head = character.position.y + CHAR_HEIGHT;
            for (let i = 0; i < blockMeshes.length; i++) {
                const b = blockMeshes[i];
                if (Math.abs(character.position.x - b.position.x) < 0.5 + CHAR_RADIUS &&
                    Math.abs(character.position.z - b.position.z) < 0.5 + CHAR_RADIUS) {
                    const bMinY = b.position.y - 0.5;
                    if (head > bMinY && character.position.y < bMinY) {
                        character.position.y = bMinY - CHAR_HEIGHT;
                        charVelocityY = 0;
                        break;
                    }
                }
            }
        }

        // Анти-застревание каждый кадр
        unstuckCharacter();

        const t = performance.now() * 0.01;
        const { legL, legR, armL, armR } = character.userData;
        if (isMoving && onGround) {
            legL.rotation.x = Math.sin(t) * 0.6;
            legR.rotation.x = -Math.sin(t) * 0.6;
            armL.rotation.x = -Math.sin(t) * 0.6;
            armR.rotation.x = Math.sin(t) * 0.6;
        } else {
            legL.rotation.x = legR.rotation.x = armL.rotation.x = armR.rotation.x = 0;
        }
    }

    function safeColor(c, fallback = '#ff6b00') {
        try {
            if (c == null || c === '') return fallback;
            const col = new THREE.Color(c);
            return col;
        } catch (_) {
            return new THREE.Color(fallback);
        }
    }

    async function loadGame() {
        try {
            // Играть могут только вошедшие в аккаунт пользователи
            const authToken = localStorage.getItem('strovo_token');
            if (!authToken) {
                const returnTo = location.pathname + location.search;
                location.href = 'login.html?next=' + encodeURIComponent(returnTo);
                return;
            }

            if (!gameId && !playCode) {
                document.getElementById('loading').innerHTML = '<p style="color:#ff4757;">ID игры не указан</p>';
                return;
            }

            const res = await fetch(
                playCode && !gameId
                    ? `${API_URL}/api/games/by-code/${encodeURIComponent(playCode)}`
                    : `${API_URL}/api/games/${gameId}`
            );
            let data;
            try {
                data = await res.json();
            } catch (_) {
                document.getElementById('loading').innerHTML = '<p style="color:#ff4757;">Сервер вернул не JSON (HTTP ' + res.status + ')</p>';
                return;
            }
            if (!data.success) {
                document.getElementById('loading').innerHTML = '<p style="color:#ff4757;">' + (data.error || 'Игра не найдена') + '</p>';
                return;
            }

            const game = data.game;
            // Зафиксировать id для presence / chat / like
            if (game.id) gameId = game.id;
            // Сервер уже редиректит play.html?id= → /games/...
            // Если slug не совпал — мягко поправим адрес
            if (game.url && location.pathname.indexOf('/games/') === 0 && location.pathname !== game.url) {
                try { history.replaceState(null, '', game.url); } catch (_) {}
            }
            const blocks = Array.isArray(game.blocks) ? game.blocks : [];
            const ownerName = game.owner || '?';

            document.getElementById('gameName').textContent = game.name || 'Без названия';
            if (game.description) {
                const tip = document.querySelector('.canvas-hint');
                /* description also in document title area via title attr */
                document.getElementById('gameName').title = game.description;
            }
            document.title = (game.name || 'Игра') + ' — Strovo';
            document.getElementById('authorName').textContent = '@' + ownerName;
            document.getElementById('authorAvatar').textContent = ownerName[0].toUpperCase();
            document.getElementById('authorAvatar').style.background = game.owner_avatar || '#ff6b00';
            document.getElementById('statPlays').textContent = Number(game.plays || 0).toLocaleString();
            document.getElementById('statLikes').textContent = Number(game.likes || 0).toLocaleString();

            // Владелец игры и цвета аватара
            const token = localStorage.getItem('strovo_token');
            let avatarColors = { head: '#ffdbac', torso: '#ff6b00', left_arm: '#ffdbac', right_arm: '#ffdbac', left_leg: '#3742fa', right_leg: '#3742fa' };
            if (token) {
                try {
                    const meRes = await fetch(`${API_URL}/api/me`, { headers: {'Authorization':'Bearer '+token} });
                    const me = await meRes.json();
                    if (me.success) {
                        myUsername = me.user.username;
                        if (me.user.avatar_parts) avatarColors = { ...avatarColors, ...me.user.avatar_parts };
                        myAvatarParts = avatarColors;
                        if (me.user.username === game.owner) {
                            const btnEdit = document.getElementById('btnEdit');
                            btnEdit.style.display = 'inline-flex';
                            btnEdit.href = `studio.html?edit=${gameId}`;
                            document.getElementById('btnStudio').href = `studio.html?edit=${gameId}`;
                        }
                    }
                } catch(e) {}
            }
            myAvatarParts = avatarColors;

            // World settings
            const ws = game.world_settings || {};
            try {
                setTimeOfDay(ws.time || 'day');
            } catch (e) {
                console.warn('setTimeOfDay', e);
            }
            try {
                const rainToggle = document.getElementById('rainToggle');
                const defaultRain = ws.weather === 'rain';
                setRain(defaultRain);
                if (rainToggle) rainToggle.checked = defaultRain;
            } catch (e) {
                console.warn('setRain', e);
            }

            // Build blocks
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            let center = new THREE.Vector3(0, 0, 0);
            if (blocks.length) {
                blocks.forEach(b => {
                    center.add(new THREE.Vector3(Number(b.x) || 0, Number(b.y) || 0, Number(b.z) || 0));
                });
                center.divideScalar(blocks.length);
            }

            blocks.forEach(b => {
                try {
                    const mesh = new THREE.Mesh(geometry, getMaterial(b.color || '#ff6b00', b.material || 'standard'));
                    mesh.position.set(Number(b.x) || 0, Number(b.y) || 0, Number(b.z) || 0);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    scene.add(mesh);
                    blockMeshes.push(mesh);
                } catch (e) {
                    console.warn('block skip', b, e);
                }
            });

            // Lights
            if (ws.lights && Array.isArray(ws.lights)) {
                ws.lights.forEach(l => {
                    try {
                        const colStr = (l.color && String(l.color).startsWith('#')) ? l.color : ('#' + (l.color || 'ffffff'));
                        const light = new THREE.PointLight(colStr, 2, 20);
                        light.position.set(Number(l.x) || 0, Number(l.y) || 0, Number(l.z) || 0);
                        scene.add(light);
                        const bulb = new THREE.Mesh(
                            new THREE.SphereGeometry(0.3, 8, 8),
                            new THREE.MeshBasicMaterial({ color: colStr })
                        );
                        bulb.position.copy(light.position);
                        scene.add(bulb);
                    } catch (e) {
                        console.warn('light skip', l, e);
                    }
                });
            }

            // Спавн: ищем свободную точку у центра (не внутри блока)
            character = buildCharacter(avatarColors);
            function findSpawn() {
                const candidates = [
                    [center.x, center.z],
                    [0, 0],
                    [center.x + 3, center.z],
                    [center.x - 3, center.z],
                    [center.x, center.z + 3],
                    [center.x, center.z - 3],
                    [center.x + 5, center.z + 5],
                    [2, 2], [-2, -2], [4, 0], [0, 4]
                ];
                for (let i = 0; i < candidates.length; i++) {
                    const sx = candidates[i][0], sz = candidates[i][1];
                    const gy = groundHeightAt(sx, sz);
                    if (!solidBlockedAt(sx, gy + 0.05, sz)) {
                        return { x: sx, y: gy + 0.02, z: sz };
                    }
                }
                return { x: center.x, y: groundHeightAt(center.x, center.z) + 2, z: center.z };
            }
            const spawn = findSpawn();
            character.position.set(spawn.x, spawn.y, spawn.z);
            character.rotation.set(0, 0, 0);
            charVelocityY = 0;
            onGround = true;
            scene.add(character);
            unstuckCharacter();
            character.rotation.x = 0;
            character.rotation.z = 0;

            camera.position.set(spawn.x, character.position.y + 8, spawn.z + 9);
            controls.target.set(spawn.x, character.position.y + 1.4, spawn.z);
            controls.update();

            document.getElementById('loading').classList.add('hidden');
            try { startPresence(); } catch (e) { console.warn('presence', e); }
        } catch(e) {
            console.error('loadGame error', e);
            document.getElementById('loading').innerHTML =
                '<p style="color:#ff4757;">Ошибка загрузки</p>' +
                '<p style="color:#a0a0b0;font-size:12px;margin-top:8px;max-width:90%;word-break:break-word;">' +
                (e && e.message ? e.message : String(e)) + '</p>';
        }
    }
    loadGame();

    let liked = false;
    document.getElementById('btnLike').addEventListener('click', async () => {
        if (liked) return;
        try {
            const res = await fetch(`${API_URL}/api/games/${gameId}/like`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                liked = true;
                document.getElementById('btnLike').classList.add('liked');
                document.getElementById('btnLike').textContent = '❤ Вам понравилось!';
                document.getElementById('statLikes').textContent = data.likes.toLocaleString();
            }
        } catch(e) {}
    });

    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        updateCharacter(dt);
        updateOtherPlayers(dt);
        if (character) {
            controls.target.lerp(new THREE.Vector3(character.position.x, character.position.y + 1.1, character.position.z), 0.25);
        }
        controls.update();
        cloudGroup.children.forEach((c, i) => { c.position.x += 0.005 * (i % 2 === 0 ? 1 : -1); });
        updateRain(dt);
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // ==================== НАСТРОЙКИ ====================
    const SETTINGS_KEY = 'strovo_play_settings';
    const defaultSettings = { sensitivity: 1.0, zoom: 40, shadows: true, chatVisible: true, chatSound: true };
    let settings = { ...defaultSettings };
    try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
        settings = { ...defaultSettings, ...saved };
    } catch(e) {}

    function applySettings() {
        controls.rotateSpeed = settings.sensitivity;
        controls.maxDistance = settings.zoom;
        renderer.shadowMap.enabled = settings.shadows;
        dirLight.castShadow = settings.shadows;
        blockMeshes.forEach(m => { m.castShadow = settings.shadows; m.receiveShadow = settings.shadows; });
        if (character) character.traverse(o => { if (o.isMesh) { o.castShadow = settings.shadows; o.receiveShadow = settings.shadows; } });
        document.getElementById('chatPanel').classList.toggle('hidden', !settings.chatVisible);

        document.getElementById('sensRange').value = settings.sensitivity;
        document.getElementById('sensVal').textContent = settings.sensitivity.toFixed(1);
        document.getElementById('zoomRange').value = settings.zoom;
        document.getElementById('zoomVal').textContent = settings.zoom;
        document.getElementById('shadowsToggle').checked = settings.shadows;
        document.getElementById('chatToggle').checked = settings.chatVisible;
        document.getElementById('chatSoundToggle').checked = settings.chatSound;
    }

    function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    }

    document.getElementById('sensRange').addEventListener('input', (e) => {
        settings.sensitivity = parseFloat(e.target.value);
        applySettings(); saveSettings();
    });
    document.getElementById('zoomRange').addEventListener('input', (e) => {
        settings.zoom = parseFloat(e.target.value);
        applySettings(); saveSettings();
    });
    document.getElementById('shadowsToggle').addEventListener('change', (e) => {
        settings.shadows = e.target.checked;
        applySettings(); saveSettings();
    });
    document.getElementById('chatToggle').addEventListener('change', (e) => {
        settings.chatVisible = e.target.checked;
        applySettings(); saveSettings();
    });
    document.getElementById('chatSoundToggle').addEventListener('change', (e) => {
        settings.chatSound = e.target.checked;
        saveSettings();
    });
    document.getElementById('rainToggle').addEventListener('change', (e) => {
        setRain(e.target.checked);
    });

    const settingsOverlay = document.getElementById('settingsOverlay');
    document.getElementById('btnSettings').addEventListener('click', () => settingsOverlay.classList.add('open'));
    document.getElementById('btnCloseSettings').addEventListener('click', () => settingsOverlay.classList.remove('open'));
    settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('open'); });

    applySettings();

    // ==================== ВЫХОД (Esc) ====================
    function leaveGame() {
        const token = localStorage.getItem('strovo_token');
        if (token && gameId) {
            try {
                const body = JSON.stringify({ token });
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(
                        `${API_URL}/api/games/${gameId}/presence/leave`,
                        new Blob([body], { type: 'application/json' })
                    );
                } else {
                    fetch(`${API_URL}/api/games/${gameId}/presence/leave`, {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                        body,
                        keepalive: true
                    }).catch(() => {});
                }
            } catch(e) {}
        }
        window.location.href = 'games.html';
    }

    document.getElementById('btnExit').addEventListener('click', leaveGame);
    document.getElementById('btnExitSettings').addEventListener('click', leaveGame);

    window.addEventListener('keydown', (e) => {
        if (e.code !== 'Escape') return;
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            e.target.blur();
            return;
        }
        // Сначала закрываем настройки, при повторном Esc — выход
        if (settingsOverlay.classList.contains('open')) {
            settingsOverlay.classList.remove('open');
            return;
        }
        leaveGame();
    });

    window.addEventListener('beforeunload', () => {
        const token = localStorage.getItem('strovo_token');
        if (token && gameId) {
            try {
                navigator.sendBeacon && navigator.sendBeacon(
                    `${API_URL}/api/games/${gameId}/presence/leave`,
                    new Blob([JSON.stringify({ token })], { type: 'application/json' })
                );
            } catch(e) {}
        }
    });

    function makeNameLabel(username, { verified = false, isAdmin = false } = {}) {
        const canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 320, 64);

        let text = username;
        if (isAdmin) text = '🛡 ' + text;

        ctx.font = 'bold 26px Inter, Arial, sans-serif';
        const textW = ctx.measureText(text).width;
        const badgeSpace = verified ? 28 : 0;
        const w = Math.min(300, textW + badgeSpace + 28);
        const x = (320 - w) / 2;

        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(x, 12, w, 40);

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        const textX = x + 14;
        ctx.fillText(text, textX, 34);

        if (verified) {
            const bx = textX + textW + 4;
            const by = 18;
            if (verifiedBadgeImg.complete && verifiedBadgeImg.naturalWidth) {
                ctx.drawImage(verifiedBadgeImg, bx, by, 26, 26);
            } else {
                // fallback — синяя галочка
                ctx.beginPath();
                ctx.arc(bx + 13, by + 13, 11, 0, Math.PI * 2);
                ctx.fillStyle = '#1da1f2';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(bx + 7, by + 13);
                ctx.lineTo(bx + 12, by + 18);
                ctx.lineTo(bx + 19, by + 8);
                ctx.stroke();
            }
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(2.6, 0.52, 1);
        sprite.position.y = 2.35;
        return sprite;
    }

    function upsertOtherPlayer(p) {
        if (p.username === myUsername) return;
        let entry = otherPlayers.get(p.username);
        if (!entry) {
            const colors = {
                head: '#ffdbac', torso: '#ff6b00', left_arm: '#ffdbac', right_arm: '#ffdbac',
                left_leg: '#3742fa', right_leg: '#3742fa',
                ...(p.avatar_parts || {})
            };
            const group = buildCharacter(colors);
            const label = makeNameLabel(p.username, { verified: !!p.verified, isAdmin: !!p.is_admin });
            group.add(label);
            scene.add(group);
            entry = { group, label, target: { x: p.x, y: p.y, z: p.z, rot: p.rot } };
            otherPlayers.set(p.username, entry);
        }
        entry.target = { x: p.x, y: p.y, z: p.z, rot: p.rot || 0 };
    }

    function removeMissingPlayers(onlineNames) {
        for (const [name, entry] of otherPlayers) {
            if (!onlineNames.has(name)) {
                scene.remove(entry.group);
                otherPlayers.delete(name);
                if (typeof closeVoicePeer === 'function') closeVoicePeer(name);
            }
        }
    }

    function renderPlayersList(players) {
        const listEl = document.getElementById('playersList');
        const count = players.length;
        document.getElementById('playersCount').textContent = count;
        document.getElementById('statPlayers').textContent = count;
        if (!count) {
            listEl.innerHTML = '<div class="players-empty">Никого онлайн...</div>';
            return;
        }
        listEl.innerHTML = players.map(p => {
            const classes = ['player-name'];
            if (p.is_admin) classes.push('admin');
            if (p.verified) classes.push('verified');
            const me = p.username === myUsername ? ' me' : '';
            const voiceCls = p.voice ? 'player-voice on' : 'player-voice';
            const voiceIcon = p.voice ? '🎤' : '';
            return `<div class="player-row${me}"><span class="player-dot"></span><span class="${classes.join(' ')}">${p.username}</span><span class="${voiceCls}">${voiceIcon}</span></div>`;
        }).join('');
    }

    async function sendPresence() {
        if (!gameId || !character) return;
        const token = localStorage.getItem('strovo_token');
        if (!token) return;
        try {
            await fetch(`${API_URL}/api/games/${gameId}/presence`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({
                    x: character.position.x,
                    y: character.position.y,
                    z: character.position.z,
                    rot: character.rotation.y,
                    avatar_parts: myAvatarParts,
                    voice: !!(voiceEnabled && localStream)
                })
            });
        } catch(e) {}
    }

    async function pollPresence() {
        if (!gameId) return;
        try {
            const res = await fetch(`${API_URL}/api/games/${gameId}/presence`);
            const data = await res.json();
            if (!data.success) return;
            const players = data.players || [];
            renderPlayersList(players);
            const names = new Set(players.map(p => p.username));
            players.forEach(upsertOtherPlayer);
            removeMissingPlayers(names);
            // WebRTC: подключаемся к тем, у кого войсе включён (и к нам)
            if (voiceEnabled && typeof syncVoicePeers === 'function') {
                syncVoicePeers(players);
            }
        } catch(e) {}
    }

    function startPresence() {
        sendPresence();
        pollPresence();
        presenceTimer = setInterval(() => {
            sendPresence();
            pollPresence();
        }, 1500);
        // WebRTC signaling poll (для приёма голоса)
        setTimeout(() => { try { startRtcPolling(); } catch (_) {} }, 500);
    }

    // ==================== VOICE CHAT (WebRTC) ====================
    let voiceEnabled = false;
    let localStream = null;
    const voicePeers = new Map(); // username -> { pc, audioEl }
    let lastRtcSignalId = null;
    let rtcPollTimer = null;

    const RTC_CONFIG = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ]
    };

    function setVoiceStatus(text, on) {
        const el = document.getElementById('voiceStatus');
        const btn = document.getElementById('btnVoice');
        if (el) {
            el.textContent = text;
            el.classList.toggle('on', !!on);
        }
        if (btn) {
            btn.classList.toggle('active', !!on);
            btn.classList.toggle('muted', !on && voiceEnabled === false);
            btn.textContent = on ? '🎤' : '🔇';
        }
    }

    async function sendRtcSignal(to, type, payload) {
        const token = localStorage.getItem('strovo_token');
        if (!token || !gameId || !to) return;
        try {
            await fetch(`${API_URL}/api/games/${gameId}/rtc`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ to, type, payload })
            });
        } catch (e) {}
    }

    function closeVoicePeer(username) {
        const peer = voicePeers.get(username);
        if (!peer) return;
        try { peer.pc.close(); } catch (_) {}
        if (peer.audioEl) {
            try { peer.audioEl.srcObject = null; peer.audioEl.remove(); } catch (_) {}
        }
        voicePeers.delete(username);
    }

    function closeAllVoicePeers() {
        for (const name of [...voicePeers.keys()]) closeVoicePeer(name);
    }

    function createPeerConnection(username, isInitiator) {
        if (voicePeers.has(username)) return voicePeers.get(username);

        const pc = new RTCPeerConnection(RTC_CONFIG);
        const audioEl = document.createElement('audio');
        audioEl.autoplay = true;
        audioEl.playsInline = true;
        audioEl.style.display = 'none';
        document.body.appendChild(audioEl);

        const peer = { pc, audioEl, isInitiator };
        voicePeers.set(username, peer);

        if (localStream) {
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }

        pc.ontrack = (ev) => {
            if (ev.streams && ev.streams[0]) {
                audioEl.srcObject = ev.streams[0];
                audioEl.play().catch(() => {});
            }
        };

        pc.onicecandidate = (ev) => {
            if (ev.candidate) {
                sendRtcSignal(username, 'ice', ev.candidate);
            }
        };

        pc.onconnectionstatechange = () => {
            if (pc.connectionState === 'failed' || pc.connectionState === 'closed' || pc.connectionState === 'disconnected') {
                // мягко переподключимся позже через syncVoicePeers
            }
        };

        if (isInitiator) {
            pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
                sendRtcSignal(username, 'offer', pc.localDescription);
            }).catch(e => console.warn('offer', e));
        }

        return peer;
    }

    async function handleRtcSignal(sig) {
        if (!sig || !sig.from || sig.from === myUsername) return;
        if (!localStorage.getItem('strovo_token')) return;
        const from = sig.from;

        if (sig.type === 'hangup') {
            closeVoicePeer(from);
            return;
        }

        if (sig.type === 'offer') {
            let peer = voicePeers.get(from);
            if (!peer) peer = createPeerConnection(from, false);
            const pc = peer.pc;
            try {
                await pc.setRemoteDescription(sig.payload);
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                sendRtcSignal(from, 'answer', pc.localDescription);
            } catch (e) {
                console.warn('handle offer', e);
            }
            return;
        }

        if (sig.type === 'answer') {
            const peer = voicePeers.get(from);
            if (!peer) return;
            try {
                if (!peer.pc.currentRemoteDescription) {
                    await peer.pc.setRemoteDescription(sig.payload);
                }
            } catch (e) {
                console.warn('handle answer', e);
            }
            return;
        }

        if (sig.type === 'ice') {
            const peer = voicePeers.get(from);
            if (!peer || !sig.payload) return;
            try {
                await peer.pc.addIceCandidate(sig.payload);
            } catch (e) {
                // candidate может прийти раньше remote description
            }
        }
    }

    async function pollRtcSignals() {
        if (!gameId) return;
        const token = localStorage.getItem('strovo_token');
        if (!token) return;
        try {
            const url = new URL(`${API_URL}/api/games/${gameId}/rtc`);
            if (lastRtcSignalId) url.searchParams.set('after_id', lastRtcSignalId);
            const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
            const data = await res.json();
            if (!data.success || !data.signals) return;
            for (const sig of data.signals) {
                await handleRtcSignal(sig);
                lastRtcSignalId = sig.id;
            }
        } catch (e) {}
    }

    function syncVoicePeers(players) {
        if (!voiceEnabled || !myUsername || !localStream) return;
        const others = players.filter(p => p.username !== myUsername);
        const online = new Set(others.map(p => p.username));

        for (const name of [...voicePeers.keys()]) {
            if (!online.has(name)) closeVoicePeer(name);
        }

        others.forEach(p => {
            if (voicePeers.has(p.username)) return;
            // Инициатор — лексикографически меньшее имя, чтобы не было двух offer
            if (myUsername < p.username) {
                createPeerConnection(p.username, true);
            }
        });
    }

    async function enableVoice() {
        const token = localStorage.getItem('strovo_token');
        if (!token) {
            alert('Войди в аккаунт, чтобы использовать голосовой чат');
            return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert('Браузер не поддерживает микрофон');
            return;
        }
        try {
            setVoiceStatus('Запрос микрофона...', false);
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                },
                video: false
            });
            voiceEnabled = true;
            setVoiceStatus('Войс вкл', true);

            // Пересоздаём соединения с микрофоном
            closeAllVoicePeers();

            sendPresence();
            if (!rtcPollTimer) {
                rtcPollTimer = setInterval(pollRtcSignals, 1000);
            }
            pollRtcSignals();
            pollPresence();
        } catch (e) {
            console.error(e);
            voiceEnabled = false;
            localStream = null;
            setVoiceStatus('Нет доступа к мик.', false);
            alert('Не удалось получить доступ к микрофону.\nРазреши микрофон в браузере для localhost.');
        }
    }

    function disableVoice() {
        const wasOn = voiceEnabled;
        voiceEnabled = false;
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
        if (wasOn) {
            for (const name of [...voicePeers.keys()]) {
                sendRtcSignal(name, 'hangup', null);
                closeVoicePeer(name);
            }
        }
        setVoiceStatus('Войс выкл', false);
        sendPresence();
    }

    document.getElementById('btnVoice').addEventListener('click', () => {
        if (voiceEnabled) disableVoice();
        else enableVoice();
    });

    function cleanupVoiceOnLeave() {
        try { disableVoice(); } catch (_) {}
        if (rtcPollTimer) {
            clearInterval(rtcPollTimer);
            rtcPollTimer = null;
        }
    }
    document.getElementById('btnExit').addEventListener('click', cleanupVoiceOnLeave);
    document.getElementById('btnExitSettings').addEventListener('click', cleanupVoiceOnLeave);
    window.addEventListener('beforeunload', cleanupVoiceOnLeave);

    // Слушаем сигналы WebRTC всегда, когда авторизован (чтобы слышать других)
    function startRtcPolling() {
        if (rtcPollTimer) return;
        if (!localStorage.getItem('strovo_token')) return;
        pollRtcSignals();
        rtcPollTimer = setInterval(pollRtcSignals, 1000);
    }

    // Плавное движение чужих персонажей
    function updateOtherPlayers(dt) {
        for (const [, entry] of otherPlayers) {
            const g = entry.group;
            const t = entry.target;
            g.position.x += (t.x - g.position.x) * Math.min(1, dt * 8);
            g.position.y += (t.y - g.position.y) * Math.min(1, dt * 8);
            g.position.z += (t.z - g.position.z) * Math.min(1, dt * 8);
            let diff = t.rot - g.rotation.y;
            diff = Math.atan2(Math.sin(diff), Math.cos(diff));
            g.rotation.y += diff * Math.min(1, dt * 8);
        }
    }

    // ==================== ЧАТ ====================
    const chatMessagesEl = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const chatSendBtn = document.getElementById('chatSend');
    let lastMessageId = null;

    // Сбрасываем зажатые клавиши движения при переходе фокуса в чат, чтобы WASD не "залипал"
    chatInput.addEventListener('focus', () => { Object.keys(keys).forEach(k => keys[k] = false); });

    function playChatBeep() {
        if (!settings.chatSound) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = 720;
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
            osc.connect(gain).connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
    }

    function appendChatMessage(msg, { system = false } = {}) {
        const div = document.createElement('div');
        if (system) {
            div.className = 'chat-system';
            div.textContent = msg;
        } else {
            div.className = 'chat-msg';
            const userClasses = ['chat-user'];
            if (msg.verified) userClasses.push('verified');
            if (msg.is_admin) userClasses.push('admin');
            const userSpan = document.createElement('span');
            userSpan.className = userClasses.join(' ');
            userSpan.textContent = msg.username + ':';
            const textSpan = document.createElement('span');
            textSpan.className = 'chat-text';
            textSpan.textContent = ' ' + msg.text;
            div.appendChild(userSpan);
            div.appendChild(textSpan);
        }
        chatMessagesEl.appendChild(div);
        while (chatMessagesEl.children.length > 60) chatMessagesEl.removeChild(chatMessagesEl.firstChild);
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    async function pollChat() {
        if (!gameId) return;
        try {
            const url = new URL(`${API_URL}/api/games/${gameId}/chat`);
            if (lastMessageId) url.searchParams.set('after_id', lastMessageId);
            const res = await fetch(url);
            const data = await res.json();
            if (data.success && data.messages.length) {
                data.messages.forEach(m => {
                    appendChatMessage(m);
                    if (m.username !== myUsername) playChatBeep();
                });
                lastMessageId = data.messages[data.messages.length - 1].id;
            }
        } catch(e) {}
    }

    async function sendChatMessage() {
        const text = chatInput.value.trim();
        if (!text) return;
        const token = localStorage.getItem('strovo_token');
        if (!token) {
            appendChatMessage('Войди в аккаунт, чтобы писать в чат', { system: true });
            return;
        }
        chatInput.value = '';
        try {
            const res = await fetch(`${API_URL}/api/games/${gameId}/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ text })
            });
            const data = await res.json();
            if (!data.success) appendChatMessage(data.error || 'Не удалось отправить сообщение', { system: true });
        } catch(e) {
            appendChatMessage('Ошибка сети при отправке', { system: true });
        }
    }

    chatSendBtn.addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendChatMessage();
        e.stopPropagation();
    });

    (async () => {
        const token = localStorage.getItem('strovo_token');
        if (token) {
            try {
                const meRes = await fetch(`${API_URL}/api/me`, { headers: {'Authorization':'Bearer '+token} });
                const me = await meRes.json();
                if (me.success) myUsername = me.user.username;
            } catch(e) {}
        }
        appendChatMessage('Чат подключён. Будь вежлив 🙂', { system: true });
        pollChat();
        setInterval(pollChat, 2500);
    })();
    </script>
