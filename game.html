        .game-detail-wrap { max-width: 1140px; margin: 0 auto; padding: 100px 24px 60px; display: grid; grid-template-columns: minmax(0, 640px) 1fr; gap: 32px; }
        @media (max-width: 900px) { .game-detail-wrap { grid-template-columns: 1fr; } }

        .game-hero-img {
            position: relative; width: 100%; aspect-ratio: 16/10; border-radius: var(--radius);
            overflow: hidden; background: linear-gradient(160deg, #eee 0%, #bbb 60%, #888 100%);
        }
        .game-hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .game-hero-overlay {
            position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 45%);
        }
        .game-hero-overlay span { color: #7CFFCB; font-size: 30px; font-weight: 900; text-shadow: 0 2px 8px rgba(0,0,0,.4); }

        .game-side-title { font-size: 32px; font-weight: 900; margin: 0 0 6px; }
        .game-side-author { display: flex; align-items: center; gap: 4px; color: var(--secondary); text-decoration: none; font-weight: 600; margin-bottom: 14px; }
        .game-side-meta { color: var(--text-muted); font-size: 14px; margin-bottom: 18px; }

        .btn-client-play {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 15px; border-radius: var(--radius-sm); border: none;
            background: var(--secondary); color: #fff; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: var(--transition); text-decoration: none; margin-bottom: 14px;
        }
        .btn-client-play:hover { filter: brightness(1.08); }
        .btn-client-play:disabled { opacity: .6; cursor: default; }

        .game-action-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .game-action-btn {
            display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-size: 13px;
            cursor: pointer; transition: var(--transition); font-family: inherit;
        }
        .game-action-btn:hover { background: var(--bg-hover); }
        .game-action-btn.active { border-color: var(--primary); color: var(--primary); }

        .game-playthroughs { color: var(--text-muted); font-size: 14px; cursor: pointer; user-select: none; }
        .game-playthroughs summary { list-style: none; }
        .game-playthroughs summary::-webkit-details-marker { display: none; }
        .game-playthroughs summary::before { content: '▶'; font-size: 10px; margin-right: 6px; display: inline-block; transition: transform .2s; }
        .game-playthroughs[open] summary::before { transform: rotate(90deg); }

        .game-tabs-wrap { grid-column: 1 / -1; }
        .game-tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
        .game-tab { padding: 12px 0; color: var(--text-muted); font-weight: 600; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; }
        .game-tab.active { color: var(--text); border-bottom-color: var(--primary); }
        .game-tab-panel { display: none; }
        .game-tab-panel.active { display: block; }
        .game-desc-text { color: var(--text-muted); line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo"><div class="logo-icon">S</div><span class="logo-text">strovo</span></a>
            <nav class="nav">
                <a href="games.html" class="nav-link">Игры</a>
                <a href="studio.html" class="nav-link">Studio</a>
                <a href="shop.html" class="nav-link">Магазин</a>
                <a href="profile.html" class="nav-link">Профиль</a>
            </nav>
            <div class="header-actions" id="headerActions">
                <div class="search-box">
                    <input type="text" placeholder="Поиск" class="search-input">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </div>
                <a href="login.html" class="btn btn-login" id="btnLogin">Войти</a>
                <a href="signup.html" class="btn btn-primary" id="btnSignup">Регистрация</a>
            </div>
        </div>
    </header>

    <div class="game-detail-wrap" id="gameDetailWrap">
        <div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:60px;" id="loadingMsg">Загрузка игры...</div>
    </div>

    <script src="js/main.js"></script>
    <script>
    const API_URL = window.location.origin;
    const params = new URLSearchParams(location.search);
    const gameId = params.get('id');

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    }

    function maturityLabel(blocksCount) {
        if (blocksCount > 3000) return 'Высокая';
        if (blocksCount > 800) return 'Средняя';
        return 'Минимальная';
    }

    async function load() {
        const wrap = document.getElementById('gameDetailWrap');
        if (!gameId) {
            wrap.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:60px;">ID игры не указан</div>';
            return;
        }
        let data;
        try {
            const res = await fetch(`${API_URL}/api/games/${encodeURIComponent(gameId)}`);
            data = await res.json();
        } catch (e) {
            wrap.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#ff4757;padding:60px;">Сервер недоступен</div>';
            return;
        }
        if (!data.success) {
            wrap.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#ff4757;padding:60px;">${esc(data.error || 'Игра не найдена')}</div>`;
            return;
        }

        const g = data.game;
        const blocksCount = Array.isArray(g.blocks) ? g.blocks.length : 0;
        const thumb = g.cover || g.photo || '';
        document.title = (g.name || 'Игра') + ' — Strovo';

        wrap.innerHTML = `
            <div class="game-hero-img">
                ${thumb ? `<img src="${esc(thumb)}" alt="">` : ''}
                <div class="game-hero-overlay"><span>${esc(g.name || 'Без названия')}</span></div>
            </div>

            <div class="game-side">
                <h1 class="game-side-title">${esc(g.name || 'Без названия')}</h1>
                <a href="profile.html?u=${esc(g.owner)}" class="game-side-author">
                    @${esc(g.owner)} ${g.owner_verified ? '<span class="verified-badge"></span>' : ''}
                </a>
                <div class="game-side-meta">
                    Зрелость: ${maturityLabel(blocksCount)} · Блоков: ${blocksCount.toLocaleString('ru-RU')} · только клиент
                </div>

                <a href="#" id="btnPlayClient" class="btn-client-play">▶ Играть в клиенте</a>

                <div class="game-action-row">
                    <button type="button" class="game-action-btn" id="btnFavorite">⭐ Избранное</button>
                    <button type="button" class="game-action-btn" id="btnNotify">🔔 Уведомить</button>
                    <button type="button" class="game-action-btn" id="btnLike">👍 <span id="likeCount">${Number(g.likes || 0)}</span></button>
                    <button type="button" class="game-action-btn" id="btnDislike">👎</button>
                </div>

                <details class="game-playthroughs">
                    <summary>${Number(g.plays || 0).toLocaleString('ru-RU')} прохождений</summary>
                </details>
            </div>

            <div class="game-tabs-wrap">
                <div class="game-tabs">
                    <div class="game-tab active" data-tab="desc">Описание</div>
                    <div class="game-tab" data-tab="shop">Магазин</div>
                    <div class="game-tab" data-tab="servers">Серверы</div>
                </div>
                <div class="game-tab-panel active" data-panel="desc">
                    <h3 style="margin:0 0 12px;">Описание</h3>
                    <div class="game-desc-text">${esc(g.description) || 'Описание пока не добавлено.'}</div>
                </div>
                <div class="game-tab-panel" data-panel="shop">
                    <p style="color:var(--text-muted);">В этой игре пока нет предметов магазина.</p>
                </div>
                <div class="game-tab-panel" data-panel="servers">
                    <p style="color:var(--text-muted);">Публичных серверов не найдено.</p>
                </div>
            </div>
        `;

        // Вкладки
        document.querySelectorAll('.game-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.game-tab-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.querySelector(`.game-tab-panel[data-panel="${tab.dataset.tab}"]`).classList.add('active');
            });
        });

        // Лайк
        document.getElementById('btnLike').addEventListener('click', async () => {
            try {
                const res = await fetch(`${API_URL}/api/games/${encodeURIComponent(gameId)}/like`, { method: 'POST' });
                const r = await res.json();
                if (r.success) document.getElementById('likeCount').textContent = r.likes;
            } catch (e) {}
        });
        document.getElementById('btnFavorite').addEventListener('click', (e) => {
            e.currentTarget.classList.toggle('active');
        });
        document.getElementById('btnNotify').addEventListener('click', (e) => {
            e.currentTarget.classList.toggle('active');
        });

        // Играть в клиенте: пробуем открыть strovo://, при отсутствии клиента — предлагаем скачать
        document.getElementById('btnPlayClient').addEventListener('click', (e) => {
            e.preventDefault();
            const browserFallback = `play.html?id=${encodeURIComponent(gameId)}`;
            let launched = false;
            const onBlur = () => { launched = true; };
            window.addEventListener('blur', onBlur, { once: true });
            window.location.href = 'strovo://play/' + encodeURIComponent(gameId);
            setTimeout(() => {
                window.removeEventListener('blur', onBlur);
                if (!launched) showDesktopPrompt(browserFallback);
            }, 1200);
        });
    }

    function showDesktopPrompt(browserHref) {
        if (document.getElementById('strovoDesktopModal')) return;
        const overlay = document.createElement('div');
        overlay.id = 'strovoDesktopModal';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;';
        overlay.innerHTML = `
          <div style="background:#15151f;border:1px solid #333;border-radius:14px;padding:28px;max-width:380px;width:100%;text-align:center;color:#fff;font-family:inherit;">
            <div style="font-size:32px;margin-bottom:8px;">🎮</div>
            <h3 style="margin:0 0 8px;font-size:18px;">Приложение Strovo не найдено</h3>
            <p style="opacity:.7;font-size:14px;margin:0 0 22px;line-height:1.4;">Эта игра доступна только в десктопном клиенте Strovo. Установите его, чтобы сыграть.</p>
            <a href="/downloads/Strovo-Setup.exe" style="display:block;background:#ff6a00;color:#fff;padding:13px;border-radius:8px;text-decoration:none;font-weight:600;margin-bottom:10px;">Скачать Strovo</a>
            <button type="button" id="strovoModalClose" style="background:none;border:none;color:#666;cursor:pointer;font-size:13px;">Закрыть</button>
          </div>`;
        document.body.appendChild(overlay);
        overlay.querySelector('#strovoModalClose').addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    load();
    </script>
</body>
</html>
